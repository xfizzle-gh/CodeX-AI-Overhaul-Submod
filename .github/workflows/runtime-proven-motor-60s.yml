name: Runtime-proven motor 60s

on:
  push:
    branches:
      - recovery/runtime-proven-motor-60s
    paths:
      - tools/apply_runtime_proven_motor_60s.py
      - tools/deploy_runtime_proven_motor_60s.ps1
      - tests/test_runtime_proven_motor_60s.py
      - .github/workflows/runtime-proven-motor-60s.yml
  pull_request:
    paths:
      - tools/apply_runtime_proven_motor_60s.py
      - tools/deploy_runtime_proven_motor_60s.ps1
      - tests/test_runtime_proven_motor_60s.py
      - .github/workflows/runtime-proven-motor-60s.yml

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/runtime-proven-motor-60s
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile timing overlay
        run: python -m py_compile tools/apply_runtime_proven_motor_60s.py
      - name: Verify byte parity except approved timing values
        run: python -m unittest tests/test_runtime_proven_motor_60s.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/runtime-proven-motor-60s
      - name: Parse exact-baseline deployment wrapper
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/deploy_runtime_proven_motor_60s.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
