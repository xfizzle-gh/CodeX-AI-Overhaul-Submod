name: Apply live air and motor fixes

on:
  push:
    branches:
      - experiment/attack-mate-slot-proof
    paths:
      - .github/workflows/apply-live-air-motor-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0

      - name: Apply live-proof repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_n(text, old, new, count, label):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count}, found {actual}')
              return text.replace(old, new)

          def sub_n(text, pattern, repl, count, label, flags=0):
              out, actual = re.subn(pattern, repl, text, flags=flags)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count}, found {actual}')
              return out

          waves_path = 'resource/map/multi/attack_support_waves.inc'
          tpl_path = 'resource/map/multi/faction_support_templates.inc'
          deploy_path = 'tools/deploy_attack_support_probe.ps1'
          e2_test_path = 'tests/test_e2_airmobile.py'
          motor_test_path = 'tests/test_attack_support_slot_proof.py'

          waves = read(waves_path)
          tpl = read(tpl_path)
          deploy = read(deploy_path)
          e2_tests = read(e2_test_path)
          motor_tests = read(motor_test_path)

          # HELICOPTER: the old marker was one of the seat-linked passengers. Placement
          # cannot move a linked occupant, so the marker stayed in the parked pool and
          # stage 30 could never prove arrival at the LZ. Use one independent hidden body.
          old_marker_selector = '{selector {ignore_captured_by_user 0} {tag support_e2_team} {amount 1}}'
          new_marker_selector = '''{selector
						{source advanced}
						{group
							{select {tag {tag support_e2_marker_tpl}}}
							{include {tag {tag hidden}}}
						}
						{amount 1}
					}'''
          waves = replace_n(waves, old_marker_selector, new_marker_selector, 1,
                            'replace linked LZ marker selector')

          marker_entity = '''

; ----- E2 INDEPENDENT LZ MARKER -----
; A dedicated, unlinked hidden body used only as the near_to anchor for helicopter
; pad safety and arrival. A seat-linked passenger cannot be MOVE-placed independently.
	{Human "mp/nato/2022s/nato_rifleman" 0xc207
		{Position -8965 -37400}
		{Player 0}
		{MID 10016}
		{Able "-select"}
	}
	{Tags "ally_sup_tpl" "support_e2_marker_tpl" "hidden" 0xc207}
'''
          if 'support_e2_marker_tpl' in tpl or '0xc207' in tpl or '{MID 10016}' in tpl:
              raise SystemExit('independent LZ marker identifiers already exist')
          tpl = tpl.rstrip() + marker_entity

          # PARADROP: the 4000-unit annulus released almost immediately after spawn.
          # Require the transport to get within 1500 map units (150 m) of its selected flag.
          waves = replace_n(
              waves,
              '{expression "1 & 2 & 3 & 4 & 5 & 7 & (8 | !6)"}',
              '{expression "1 & 2 & 3 & 4 & 5 & 7"}',
              3,
              'tighten paradrop expressions',
          )
          waves = sub_n(
              waves,
              r'(^\s*\{"5\.near"[^\n]*\{distance )4000(\}[^\n]*$)',
              r'\g<1>1500\g<2>',
              3,
              'tighten paradrop release radius',
              flags=re.MULTILINE,
          )
          waves = sub_n(
              waves,
              r'^\s*\{"6\.near"[^\n]*\{distance 600\}[^\n]*\}\n',
              '',
              3,
              'remove paradrop inner-hole terms',
              flags=re.MULTILINE,
          )
          waves = sub_n(
              waves,
              r'^\s*\{"8\.cmp_i" \{var "support_e2_para_pass\$"\} \{op "=="\} \{value 1\}\}\n',
              '',
              3,
              'remove paradrop pass fallback terms',
              flags=re.MULTILINE,
          )

          takeover = '''

			; ===== E2 LANDED PARATROOPER TAKEOVER =====
			; The aircraft interaction creates paratrooper_need_orders on each jumper. Wait
			; until a body is no longer linked to its canopy, then give that delivered body
			; to the support player and order it at the selected flag. Autoreset lets later
			; members of the same four-man stick be collected as they finish landing.
			{"attack_support/e2_para_takeover"
				{autoreset}
				{condition
					{expression "1 & 2 & 3 & 4"}
					{terms
						{"1.cmp_i" {var "user_is_defender$"} {op "=="} {value 0}}
						{"2.cmp_i" {var "support_e2_test$"} {op "=="} {value 2}}
						{"3.cmp_i" {var "support_e2_stage$"} {op "=="} {value 40}}
						{"4.entities"
							{selector
								{source advanced}
								{group
									{select {tag {tag paratrooper_need_orders}}}
									{exclude
										{tag {tag support_e2_pax}}
										{state {state linked}}
										{state {state inactive}}
										{state {state dead}}
									}
								}
							}
							{count {op ">="} {value 1}}
						}
					}
				}
				{actions
					{"entity_state"
						{selector
							{source advanced}
							{group
								{select {tag {tag paratrooper_need_orders}}}
								{exclude
									{tag {tag support_e2_pax}}
									{state {state linked}}
									{state {state inactive}}
									{state {state dead}}
								}
							}
						}
						{tag_add support_e2_pax}
						{tag_add support_e2_team}
						{tag_add attack_support_src}
						{inactive off}
						{impregnability disabled}
						{discovered on}
					}
					("e2_own_pax")
					{"delay" {time 0.2}}
					("e2_order_team")
				}
			}
'''
          linker_marker = '\n\n\t\t\t; ===== THE PARACHUTE LINKERS (2026-07-31) ====='
          waves = replace_n(waves, linker_marker, takeover + linker_marker, 1,
                            'insert landed paratrooper takeover')

          # MOTOR: the last checkpoint changed the live-working vehicle approach from
          # advance to move. The live run proved every 28-second clock completed at the
          # entry pad. Restore advance, keep move only for the later off-map exit, measure
          # the same objective that was ordered, and repeatedly retire departing hulls.
          motor_files = {
              'resource/map/multi/attack_support_waves.inc': (
                  'attack_support_motor_hull', 'attack_support_motor_flag',
                  'attack_support_motor_pax', 'attack_support/motor_cleanup'),
              'resource/map/multi/defense_support_waves.inc': (
                  'def_sup_motor_hull', 'def_sup_motor_flag',
                  'def_sup_motor_pax', 'defense_support/motor_cleanup'),
              'resource/map/multi/enemy_attack_support.inc': (
                  'ea_motor_hull', 'ea_motor_flag',
                  'ea_motor_pax', 'enemy_attack/motor_cleanup'),
              'resource/map/multi/enemy_defense_support.inc': (
                  'enemy_def_motor_hull', 'enemy_def_motor_flag',
                  'enemy_def_motor_pax', 'enemy_defense/motor_cleanup'),
          }
          motor_texts = {waves_path: waves}
          for path in motor_files:
              if path != waves_path:
                  motor_texts[path] = read(path)

          for path, (hull, flag, pax, cleanup) in motor_files.items():
              text = motor_texts[path]
              approach_pattern = (
                  r'(\{"action"\s*\n\s*\{selector \{ignore_captured_by_user 0\} '
                  + re.escape('{tag ' + hull + '}')
                  + r'\}\s*\n\s*\{drop orders\}\s*\n\s*)\{action move\}'
                  + r'(\s*\n\s*\{target \{ignore_captured_by_user 0\} '
                  + re.escape('{tag ' + flag + '}') + r'\})'
              )
              text = sub_n(text, approach_pattern, r'\g<1>{action advance}\g<2>', 1,
                           f'{path}: restore approach advance')

              # The proof must measure the exact objective tag, not the whole flag set.
              text = replace_n(
                  text,
                  '{near_to {ignore_captured_by_user 0} {tag flag}}',
                  '{near_to {ignore_captured_by_user 0} {tag ' + flag + '}}',
                  3,
                  f'{path}: restore objective telemetry',
              )

              # Each truck gets its own delayed cleanup cycle.
              cleanup_pattern = r'(\{"' + re.escape(cleanup) + r'"\s*\n)(\s*\{condition)'
              text = sub_n(text, cleanup_pattern, r'\g<1>\t\t\t\t{autoreset}\n\g<2>', 1,
                           f'{path}: autoreset cleanup')

              # Do not issue foot orders to bodies still linked into a seat.
              old_pax_selector = '{selector {ignore_captured_by_user 0} {tag ' + pax + '}}'
              new_pax_selector = '''{selector
						{source advanced}
						{ignore_captured_by_user 0}
						{group
							{select {tag {tag ''' + pax + '''}}}
							{exclude {state {state linked}} {state {state inactive}} {state {state dead}}}
						}
					}'''
              text = replace_n(text, old_pax_selector, new_pax_selector, 1,
                               f'{path}: order only emitted pax')
              motor_texts[path] = text

          waves = motor_texts.pop(waves_path)
          for path, text in motor_texts.items():
              write(path, text)

          # Deploy guards describe the new live contract.
          deploy = replace_n(
              deploy,
              "$E2HeloTemplateMarkers = @('support_e2_prc_helo', '{Altitude 22}')",
              "$E2HeloTemplateMarkers = @('support_e2_prc_helo', '{Altitude 22}', 'support_e2_marker_tpl', '0xc207', '{MID 10016}')",
              1,
              'deploy independent marker guard',
          )
          deploy = replace_n(deploy, "    '{distance 600}',\n", "    '{distance 1500}',\n", 1,
                             'deploy required para radius')
          deploy = replace_n(deploy, "    '{distance 1500}',\n", "    '{distance 600}',\n", 1,
                             'deploy forbidden para radius')
          # The two replacements above swap identical-looking lines in different arrays;
          # verify their final scoped placement rather than trusting global presence.
          para_required = deploy.split('$E2ParaWaveMarkers = @(', 1)[1].split(')\n$E2ParaForbiddenMarkers', 1)[0]
          para_forbidden = deploy.split('$E2ParaForbiddenMarkers = @(', 1)[1].split(')\nforeach', 1)[0]
          if "'{distance 1500}'" not in para_required or "'{distance 600}'" in para_required:
              raise SystemExit('required paradrop radius guard is wrong')
          if "'{distance 600}'" not in para_forbidden or "'{distance 1500}'" in para_forbidden:
              raise SystemExit('forbidden paradrop radius guard is wrong')
          deploy = replace_n(
              deploy,
              "    '{\"attack_support/e2_para_alive\"',\n",
              "    '{\"attack_support/e2_para_alive\"',\n    '{\"attack_support/e2_para_takeover\"',\n",
              1,
              'deploy takeover trigger guard',
          )

          # Update structural tests to pin the repaired contracts.
          e2_tests = replace_n(e2_tests, "self.assertIn('{tag support_e2_team}', claim)",
                               "self.assertIn('{tag support_e2_marker_tpl}', claim)", 1,
                               'test independent marker tag')
          e2_tests = replace_n(e2_tests, "self.assertNotIn('{tag_remove support_e2_team}', claim)",
                               "self.assertNotIn('{tag_remove support_e2_marker_tpl}', claim)", 1,
                               'test marker pool retained')

          old_release_asserts = '''            # Widened band: 600-4000, a 3400-unit annulus. The old 1500-2500 shell was
            # 150-250m out and the airborne chassis crosses it in under 4 seconds - or
            # misses it entirely on an off-axis run-in. Both old values are gone.
            self.assertEqual(condition.count('{distance 4000}'), 1)
            self.assertEqual(condition.count('{distance 600}'), 1)
            self.assertNotIn('{distance 2500}', condition)
            self.assertNotIn('{distance 1500}', condition)
            self.assertRegex(condition, r'\{expression "[^"]*!\d+[^"]*"\}')
            # Term 8 is the bounded closest-approach fallback, ORed against the inner
            # exclusion so a run-in that steps into the hole or parks overhead still
            # drops. It never bypasses the outer ring, which is ANDed in on its own.
            self.assertIn(
                '{"8.cmp_i" {var "support_e2_para_pass$"} {op "=="} {value 1}}', condition
            )
            expression = re.search(r'\{expression "([^"]+)"\}', condition).group(1)
            self.assertEqual(expression, "1 & 2 & 3 & 4 & 5 & 7 & (8 | !6)")'''
          new_release_asserts = '''            # Live proof: the 4000-unit annulus fired almost immediately at the
            # backline. Release now requires the aircraft to reach 1500 units (150 m)
            # from the selected flag; there is no inner-hole or pass fallback.
            self.assertEqual(condition.count('{distance 1500}'), 1)
            self.assertNotIn('{distance 4000}', condition)
            self.assertNotIn('{distance 600}', condition)
            self.assertNotIn('{distance 2500}', condition)
            self.assertNotIn('{"6.near"', condition)
            self.assertNotIn('{"8.cmp_i"', condition)
            expression = re.search(r'\{expression "([^"]+)"\}', condition).group(1)
            self.assertEqual(expression, "1 & 2 & 3 & 4 & 5 & 7")'''
          e2_tests = replace_n(e2_tests, old_release_asserts, new_release_asserts, 1,
                               'test tight release radius')

          old_ring_assert = '''                self.assertEqual(
                    sorted(int(v) for v in re.findall(r"\{distance (\d+)\}", condition)),
                    [600, 4000],
                )
        # The retired shell is still banned in both directions.
        for retired in ("{distance 1500}", "{distance 2500}"):
            self.assertNotIn(retired, self.para)
            self.assertIn("'%s'" % retired, self.deploy)'''
          new_ring_assert = '''                self.assertEqual(
                    sorted(int(v) for v in re.findall(r"\{distance (\d+)\}", condition)),
                    [1500],
                )
        # The backline annulus and the older outer shell stay retired.
        for retired in ("{distance 600}", "{distance 2500}"):
            self.assertNotIn(retired, self.para)
            self.assertIn("'%s'" % retired, self.deploy)'''
          e2_tests = replace_n(e2_tests, old_ring_assert, new_ring_assert, 1,
                               'test release ring contract')

          # Pin the landed takeover without relying on CE's several-minute order delay.
          insertion = '''

    def test_landed_paratroopers_are_owned_and_ordered_immediately(self) -> None:
        takeover = mi_block(self.waves, '{"attack_support/e2_para_takeover"')
        condition, actions = takeover.split('{actions', 1)
        self.assertIn('{autoreset}', takeover)
        self.assertIn('{var "support_e2_stage$"} {op "=="} {value 40}', condition)
        self.assertIn('{tag paratrooper_need_orders}', condition)
        self.assertIn('{state {state linked}}', condition)
        self.assertIn('{tag_add support_e2_pax}', actions)
        self.assertIn('("e2_own_pax")', actions)
        self.assertIn('("e2_order_team")', actions)
'''
          anchor = '\n\nclass E2NumericWaypointBandTests(unittest.TestCase):'
          e2_tests = replace_n(e2_tests, anchor, insertion + anchor, 1,
                               'insert landed takeover test')

          motor_tests = replace_n(
              motor_tests,
              'advance = body.index("{action move}")\n                self.assertNotIn("{action advance}", body[:emit])',
              'advance = body.index("{action advance}")\n                self.assertNotIn("{action move}", body[:emit])',
              1,
              'test restored motor advance',
          )

          write(waves_path, waves)
          write(tpl_path, tpl)
          write(deploy_path, deploy)
          write(e2_test_path, e2_tests)
          write(motor_test_path, motor_tests)
          PY

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused live-proof tests
        run: |
          python -m pytest tests/test_e2_airmobile.py -q
          python -m pytest tests/test_attack_support_slot_proof.py -q -k 'motor or objective or drive_phase or linked'
          git diff --check

      - name: Run full test suite
        run: python -m pytest tests/ -q

      - name: Commit repairs and remove helpers
        shell: bash
        run: |
          rm -f .github/workflows/apply-live-air-motor-fixes.yml
          rm -f .github/workflows/export-live-debug-branch.yml
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add resource/map/multi/attack_support_waves.inc \
                  resource/map/multi/defense_support_waves.inc \
                  resource/map/multi/enemy_attack_support.inc \
                  resource/map/multi/enemy_defense_support.inc \
                  resource/map/multi/faction_support_templates.inc \
                  tools/deploy_attack_support_probe.ps1 \
                  tests/test_e2_airmobile.py \
                  tests/test_attack_support_slot_proof.py \
                  .github/workflows
          git commit -m 'Fix live helicopter, paradrop, and motor delivery'
          git push origin HEAD:experiment/attack-mate-slot-proof
