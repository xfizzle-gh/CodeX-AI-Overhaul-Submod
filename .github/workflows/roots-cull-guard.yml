name: Roots cull source guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run roots-cull source guard
        run: python -m unittest tests/test_roots_cull.py
