name: Canonical motor production

on:
  push:
    branches:
      - feature/canonical-motor-all-quadrants
    paths:
      - tools/apply_canonical_motor_production_overlay.py
      - tools/deploy_canonical_motor_production.ps1
      - tests/test_canonical_motor_production_overlay.py
      - .github/workflows/canonical-motor-production.yml
  pull_request:
    paths:
      - tools/apply_canonical_motor_production_overlay.py
      - tools/deploy_canonical_motor_production.ps1
      - tests/test_canonical_motor_production_overlay.py
      - .github/workflows/canonical-motor-production.yml

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-motor-all-quadrants
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile overlay
        run: python -m py_compile tools/apply_canonical_motor_production_overlay.py
      - name: Validate all four engines
        run: python -m unittest tests/test_canonical_motor_production_overlay.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-motor-all-quadrants
      - name: Parse deployment wrapper
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/deploy_canonical_motor_production.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
