name: Canonical motor production

on:
  push:
    branches:
      - feature/canonical-motor-all-quadrants
      - fix/motor-linked-seat-regression
    paths:
      - tools/apply_canonical_motor_production_overlay.py
      - tools/apply_motor_linked_seat_hotfix.py
      - tools/apply_motor_entry_waypoint_hotfix.py
      - tools/deploy_canonical_motor_production.ps1
      - tests/test_canonical_motor_production_overlay.py
      - tests/test_motor_linked_seat_hotfix.py
      - tests/test_motor_entry_waypoint_hotfix.py
      - .github/workflows/canonical-motor-production.yml
  pull_request:
    paths:
      - tools/apply_canonical_motor_production_overlay.py
      - tools/apply_motor_linked_seat_hotfix.py
      - tools/apply_motor_entry_waypoint_hotfix.py
      - tools/deploy_canonical_motor_production.ps1
      - tests/test_canonical_motor_production_overlay.py
      - tests/test_motor_linked_seat_hotfix.py
      - tests/test_motor_entry_waypoint_hotfix.py
      - .github/workflows/canonical-motor-production.yml

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/motor-linked-seat-regression
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile overlays
        run: |
          python -m py_compile tools/apply_canonical_motor_production_overlay.py
          python -m py_compile tools/apply_motor_linked_seat_hotfix.py
          python -m py_compile tools/apply_motor_entry_waypoint_hotfix.py
      - name: Validate production transform
        run: python -m unittest tests/test_canonical_motor_production_overlay.py
      - name: Validate linked seats and isolated motor dispatch
        run: python -m unittest tests/test_motor_linked_seat_hotfix.py
      - name: Validate numbered motor placement pads
        run: python -m unittest tests/test_motor_entry_waypoint_hotfix.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/motor-linked-seat-regression
      - name: Parse deployment wrapper
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/deploy_canonical_motor_production.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
