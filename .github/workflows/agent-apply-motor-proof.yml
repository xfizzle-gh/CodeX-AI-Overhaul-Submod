name: Apply motor movement proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'experiment/attack-mate-slot-proof' || github.ref_name == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0
      - name: Download and apply motor proof patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/6cdebb520bb48f2d61d5ce24c74341089782f080" \
            | python -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
            > /tmp/motorproof.patch.gz
          gzip -t /tmp/motorproof.patch.gz
          gzip -dc /tmp/motorproof.patch.gz > /tmp/motorproof.patch
          echo 'f7a3344ea47110b735728e3821614f2533d4eb4216a808b6e946f42b1c2426a7  /tmp/motorproof.patch' | sha256sum -c -
          git apply --check /tmp/motorproof.patch
          git apply /tmp/motorproof.patch
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run focused motor and waypoint tests
        run: |
          python -m pytest tests/test_attack_support_slot_proof.py -q -k 'motor or objective or drive_phase'
          python -m pytest tests/test_e2_airmobile.py -q -k 'waypoint or band or collision'
          git diff --check
      - name: Remove helper and commit
        shell: bash
        run: |
          rm -f .github/workflows/agent-apply-motor-proof.yml
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add \
            resource/map/multi/attack_support_waves.inc \
            resource/map/multi/defense_support_waves.inc \
            resource/map/multi/enemy_attack_support.inc \
            resource/map/multi/enemy_defense_support.inc \
            tests/test_attack_support_slot_proof.py \
            docs/plans/2026-07-31-session-handoff.md \
            .github/workflows
          git commit -m 'Make motor movement and telemetry evidence reliable'
          git push origin HEAD:experiment/attack-mate-slot-proof
