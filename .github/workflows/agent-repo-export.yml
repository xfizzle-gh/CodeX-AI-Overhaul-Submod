name: Apply helicopter checkpoint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'experiment/attack-mate-slot-proof' || github.ref_name == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild clean helicopter checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head="$GITHUB_SHA"
          git reset --hard 8990d4f64470dcb1c66f1a7025207d9528c175cd
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/e998d47627f0a9d42868eb53924830be2642b4ad" \
            | python -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
            > /tmp/helo.patch.gz
          gzip -dc /tmp/helo.patch.gz > /tmp/helo.patch
          git apply --check /tmp/helo.patch
          git apply /tmp/helo.patch
          python -m pytest tests/test_e2_airmobile.py \
            tests/test_attack_support_slot_proof.py::LinkedBodyPlacementTests \
            tests/test_attack_support_slot_proof.py::AttackSupportAirmobileTests -q
          git diff --check
          git config user.name "xFizzle"
          git config user.email "87280532+xfizzle-gh@users.noreply.github.com"
          git add resource/map/multi/attack_support_waves.inc \
            resource/map/multi/faction_support_templates.inc \
            tests/test_attack_support_slot_proof.py \
            tests/test_e2_airmobile.py \
            tools/deploy_attack_support_probe.ps1
          git commit -m "Land helicopters and disembark linked passengers"
          git push --force-with-lease=refs/heads/experiment/attack-mate-slot-proof:${remote_head} \
            origin HEAD:refs/heads/experiment/attack-mate-slot-proof
