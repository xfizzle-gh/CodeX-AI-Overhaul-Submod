name: Clean one-minute allied support scaffolding

on:
  pull_request:
    paths:
      - "tools/apply_one_minute_allied_support_test.py"
      - ".github/workflows/apply-one-minute-allied-support-test.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v6
        with:
          ref: test/one-minute-allied-support-waves
          fetch-depth: 0

      - name: Verify final gameplay source
        run: python -m unittest tests/test_woodland_support_probe.py

      - name: Remove temporary patcher and workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_one_minute_allied_support_test.py
          git rm .github/workflows/apply-one-minute-allied-support-test.yml
          git commit -m "Remove temporary support-wave test scaffolding"
          git push origin HEAD:test/one-minute-allied-support-waves
