name: Apply one-minute allied support test

on:
  pull_request:
    paths:
      - "tools/apply_one_minute_allied_support_test.py"
      - ".github/workflows/apply-one-minute-allied-support-test.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v6
        with:
          ref: test/one-minute-allied-support-waves
          fetch-depth: 0

      - name: Apply narrow support-wave patch
        run: |
          python -m py_compile tools/apply_one_minute_allied_support_test.py
          python tools/apply_one_minute_allied_support_test.py

      - name: Run CWA support structural guard
        run: python -m unittest tests/test_woodland_support_probe.py

      - name: Commit gameplay and guard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource/map/multi/allied_support_ownership_probe.inc tests/test_woodland_support_probe.py
          git commit -m "Test allied support waves every minute"
          git push origin HEAD:test/one-minute-allied-support-waves
