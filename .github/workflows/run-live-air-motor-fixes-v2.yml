name: Run scoped live air and motor fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-live-air-motor-fixes-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0

      - name: Recover base repair payload
        shell: bash
        run: |
          awk '
            /^          ZnJv/ {capture=1}
            /^          B64$/ {capture=0}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/run-live-air-motor-fixes.yml > /tmp/live_fix.b64
          base64 -d /tmp/live_fix.b64 > /tmp/apply_live_air_motor_fixes.py
          python -m py_compile /tmp/apply_live_air_motor_fixes.py

      - name: Correct engine-specific finisher matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply_live_air_motor_fixes.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '        "attack_support/motor_cleanup",\n    ),',
                  '        "attack_support/motor_cleanup",\n        "as_finish_motor",\n    ),',
              ),
              (
                  '        "defense_support/motor_cleanup",\n    ),',
                  '        "defense_support/motor_cleanup",\n        "ds_finish_motor",\n    ),',
              ),
              (
                  '        "enemy_attack/motor_cleanup",\n    ),',
                  '        "enemy_attack/motor_cleanup",\n        "ea_finish_motor",\n    ),',
              ),
              (
                  '        "enemy_defense/motor_cleanup",\n    ),',
                  '        "enemy_defense/motor_cleanup",\n        "ed_finish_motor",\n    ),',
              ),
              (
                  'for path, (hull, objective, pax, cleanup_trigger) in motor_files.items():',
                  'for path, (hull, objective, pax, cleanup_trigger, finisher_name) in motor_files.items():',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected one script fragment, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          start_token = '    # Scope the foot order to bodies that the emit has actually unlinked.'
          end_token = '    motor_texts[path] = text'
          start = text.index(start_token)
          end = text.index(end_token, start)
          replacement = '''    # Scope the foot order to bodies that the emit has actually unlinked. Work inside
    # the named finisher because each engine uses different prose before this action.
    finisher_start = text.index('(define "' + finisher_name + '"')
    next_define = text.find('(define "', finisher_start + 10)
    finisher_end = len(text) if next_define < 0 else next_define
    finisher = text[finisher_start:finisher_end]
    old_pax_selector = '{selector {ignore_captured_by_user 0} {tag ' + pax + '}}'
    new_pax_selector = ''' + '"""' + '''{selector
\t\t\t\t\t\t{source advanced}
\t\t\t\t\t\t{ignore_captured_by_user 0}
\t\t\t\t\t\t{group
\t\t\t\t\t\t\t{select {tag {tag ''' + "''' + pax + '''" + '''}}}
\t\t\t\t\t\t\t{exclude {state {state linked}} {state {state inactive}} {state {state dead}}}
\t\t\t\t\t\t}
\t\t\t\t\t}''' + '"""' + '''
    finisher = replace_exact(
        finisher,
        old_pax_selector,
        new_pax_selector,
        1,
        f'{path}: order only emitted passengers',
    )
    text = text[:finisher_start] + finisher + text[finisher_end:]

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile /tmp/apply_live_air_motor_fixes.py
          python /tmp/apply_live_air_motor_fixes.py

      - name: Apply final guard-compatible corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1, found {count}')
              return text.replace(old, new, 1)

          waves_path = Path('resource/map/multi/attack_support_waves.inc')
          templates_path = Path('resource/map/multi/faction_support_templates.inc')
          e2_tests_path = Path('tests/test_e2_airmobile.py')
          motor_tests_path = Path('tests/test_attack_support_slot_proof.py')

          waves = waves_path.read_text(encoding='utf-8')
          templates = templates_path.read_text(encoding='utf-8')
          e2_tests = e2_tests_path.read_text(encoding='utf-8')
          motor_tests = motor_tests_path.read_text(encoding='utf-8')

          decorated_marker = '''{selector
						{source advanced}
						{group
							{select {tag {tag support_e2_marker_tpl}}}
							{include {tag {tag hidden}}}
						}
						{amount 1}
					}'''
          bare_marker = '{selector {ignore_captured_by_user 0} {tag support_e2_marker_tpl} {amount 1}}'
          waves = replace_once(waves, decorated_marker, bare_marker,
                               'replace decorated marker selector')
          templates = replace_once(
              templates,
              '{Tags "ally_sup_tpl" "support_e2_marker_tpl" "hidden" 0xc207}',
              '{Tags "support_e2_marker_tpl" 0xc207}',
              'isolate marker tag and remove hidden state',
          )
          templates = templates.replace(
              '; A dedicated, unlinked hidden body used only as the near_to anchor for helicopter',
              '; A dedicated, unlinked parked body used only as the near_to anchor for helicopter',
              1,
          )

          e2_tests = replace_once(
              e2_tests,
              '        self.assertEqual(self.live.count("{tag_add support_e2_pax}"), 3)',
              '        self.assertEqual(self.live.count("{tag_add support_e2_pax}"), 4)',
              'update completed delivery count',
          )
          helo_anchor = '''        self.assertIn("{tag_remove support_e2_helo_pax}", helo)

    def test_the_pax_tag_carries_the_literal_1_to_16_switch_and_fails_closed(self) -> None:
'''
          takeover_assert = '''        self.assertIn("{tag_remove support_e2_helo_pax}", helo)

        para = mi_block(self.live, '{"attack_support/e2_para_takeover"')
        self.assertEqual(para.count("{tag_add support_e2_pax}"), 1)
        self.assertIn("{tag paratrooper_need_orders}", para)
        self.assertIn("{state {state linked}}", para)
        self.assertIn("{state {state inactive}}", para)
        self.assertIn("{state {state dead}}", para)
        self.assertIn('(\"e2_own_pax\")', para)
        self.assertIn('(\"e2_order_team\")', para)

    def test_the_pax_tag_carries_the_literal_1_to_16_switch_and_fails_closed(self) -> None:
'''
          e2_tests = replace_once(e2_tests, helo_anchor, takeover_assert,
                                  'pin paratrooper delivery path')

          old_motor = '''                # The reference tag is the same tag the advance order targeted.
                advance = body.index("{action advance}")
                self.assertNotIn("{action move}", body[:emit])
                target = block_at(body, body.index("{target", advance))
'''
          new_motor = '''                # The reference tag is the same tag the advance order targeted.
                emit = body.index('{"emit"')
                advance = body.index("{action advance}")
                self.assertLess(advance, emit)
                self.assertNotIn("{action move}", body[:emit])
                target = block_at(body, body.index("{target", advance))
'''
          motor_tests = replace_once(motor_tests, old_motor, new_motor,
                                     'define motor emit boundary')

          waves_path.write_text(waves, encoding='utf-8')
          templates_path.write_text(templates, encoding='utf-8')
          e2_tests_path.write_text(e2_tests, encoding='utf-8')
          motor_tests_path.write_text(motor_tests, encoding='utf-8')
          PY

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused tests
        run: |
          python -m pytest tests/test_e2_airmobile.py -q
          python -m pytest tests/test_attack_support_slot_proof.py -q \
            -k 'motor or objective or drive_phase or linked or engine_never_clones'
          git diff --check

      - name: Run full test suite
        run: python -m pytest tests/ -q

      - name: Commit repairs and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-live-air-motor-fixes.yml
          rm -f .github/workflows/run-live-air-motor-fixes.yml
          rm -f .github/workflows/run-live-air-motor-fixes-v2.yml
          rm -f .github/workflows/run-live-air-motor-fixes-v4.yml
          rm -f .github/workflows/export-live-debug-branch.yml
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add resource/map/multi/attack_support_waves.inc \
                  resource/map/multi/defense_support_waves.inc \
                  resource/map/multi/enemy_attack_support.inc \
                  resource/map/multi/enemy_defense_support.inc \
                  resource/map/multi/faction_support_templates.inc \
                  tools/deploy_attack_support_probe.ps1 \
                  tests/test_e2_airmobile.py \
                  tests/test_attack_support_slot_proof.py \
                  .github/workflows
          git commit -m 'Fix live helicopter, paradrop, and motor delivery'
          git push origin HEAD:experiment/attack-mate-slot-proof
