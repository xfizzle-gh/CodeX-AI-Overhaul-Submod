name: Run scoped live air and motor fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-live-air-motor-fixes-v2.yml
      - tools/live_fix_patcher.py
      - tools/live_final_corrections.py

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0

      - name: Decode base repair
        shell: bash
        run: |
          awk '
            /^          ZnJv/ {capture=1}
            /^          B64$/ {capture=0}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/run-live-air-motor-fixes.yml > /tmp/live_fix.b64
          base64 -d /tmp/live_fix.b64 > /tmp/apply_live_air_motor_fixes.py
          python -m py_compile /tmp/apply_live_air_motor_fixes.py

      - name: Apply repair
        run: |
          python -m py_compile tools/live_fix_patcher.py tools/live_final_corrections.py
          python tools/live_fix_patcher.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/live_final_corrections.py')
          text = path.read_text(encoding='utf-8')
          bad = "drive_end = motor_tests.index('\n    def ', drive_start + 8)"
          good = "drive_end = motor_tests.index(chr(10) + '    def ', drive_start + 8)"
          if text.count(bad) != 1:
              raise RuntimeError(
                  f'generated drive boundary: expected 1 malformed form, found {text.count(bad)}'
              )
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY
          python -m py_compile tools/live_final_corrections.py
          python -m py_compile /tmp/apply_live_air_motor_fixes.py
          python /tmp/apply_live_air_motor_fixes.py
          python tools/live_final_corrections.py

          # The dedicated helicopter LZ marker is a parked Player-0, unselectable body,
          # but intentionally does not carry ally_sup_tpl or hidden. Update only the
          # aggregate entity, player, and entity-ID counts in the faction-pool guard.
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_attack_support_slot_proof.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def test_faction_pool_is_deep_enough_for_every_faction')
          end = text.index(chr(10) + '    def ', start + 8)
          block = text[start:end]
          replacements = (
              (
                  '        self.assertEqual(code.count(\'{Able "-select"}\'), 633)',
                  '        self.assertEqual(code.count(\'{Able "-select"}\'), 634)',
              ),
              (
                  '        self.assertEqual(code.count("{Player 0}"), 633)',
                  '        self.assertEqual(code.count("{Player 0}"), 634)',
              ),
              (
                  '        self.assertEqual(len(ids), 633)',
                  '        self.assertEqual(len(ids), 634)',
              ),
              (
                  '        self.assertEqual(len(set(ids)), 633)',
                  '        self.assertEqual(len(set(ids)), 634)',
              ),
          )
          for old, new in replacements:
              if block.count(old) != 1:
                  raise RuntimeError(
                      f'faction marker count: expected one old assertion, found {block.count(old)}: {old}'
                  )
              block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused tests
        run: |
          python -m pytest tests/test_e2_airmobile.py -q
          python -m pytest tests/test_attack_support_slot_proof.py -q \
            -k 'motor or objective or drive_phase or linked or engine_never_clones'
          git diff --check

      - name: Run repository suite
        run: |
          # These two methods require the locally installed sibling Code:X workshop
          # dependency (3261086933), which is not present on GitHub-hosted runners.
          # Every other repository test remains in the gate.
          python -m pytest tests/ -q \
            --deselect=tests/test_attack_support_slot_proof.py::AttackSupportSlotProofTests::test_wave_pool_is_deep_enough_for_the_level_budget \
            --deselect=tests/test_enemy_defense_support.py::EnemyDefenseSupportTests::test_pool_parks_four_faction_pools_deep_enough_for_the_budget

      - name: Commit repair and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/apply-live-air-motor-fixes.yml
          rm -f .github/workflows/run-live-air-motor-fixes.yml
          rm -f .github/workflows/run-live-air-motor-fixes-v2.yml
          rm -f .github/workflows/run-live-air-motor-fixes-v4.yml
          rm -f .github/workflows/export-live-debug-branch.yml
          rm -f tools/live_fix_patcher.py tools/live_final_corrections.py
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add resource/map/multi/attack_support_waves.inc \
                  resource/map/multi/defense_support_waves.inc \
                  resource/map/multi/enemy_attack_support.inc \
                  resource/map/multi/enemy_defense_support.inc \
                  resource/map/multi/faction_support_templates.inc \
                  tools/deploy_attack_support_probe.ps1 \
                  tests/test_e2_airmobile.py \
                  tests/test_attack_support_slot_proof.py \
                  .github/workflows tools
          git commit -m 'Fix live helicopter, paradrop, and motor delivery'
          git push origin HEAD:experiment/attack-mate-slot-proof
