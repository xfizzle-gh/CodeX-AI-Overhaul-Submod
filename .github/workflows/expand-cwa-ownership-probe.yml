name: Expand CWA ownership probe

on:
  pull_request:
    paths:
      - "tools/inventory_cwa_mission_structure.py"
      - ".github/workflows/expand-cwa-ownership-probe.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out expansion branch
        uses: actions/checkout@v6
        with:
          ref: prototype/all-cwa-defenderbot-ownership
          fetch-depth: 0

      - name: Inventory CWA mission structures
        run: |
          mkdir -p docs
          python tools/inventory_cwa_mission_structure.py > docs/cwa-mission-structure.txt
          cat docs/cwa-mission-structure.txt

      - name: Publish inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cwa-mission-structure.txt
          git commit -m "Record CWA mission structure inventory"
          git push origin HEAD:prototype/all-cwa-defenderbot-ownership
