name: Expand CWA ownership probe

on:
  pull_request:
    paths:
      - "tools/finalize_all_cwa_probe.py"
      - ".github/workflows/expand-cwa-ownership-probe.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out expansion branch
        uses: actions/checkout@v6
        with:
          ref: prototype/all-cwa-defenderbot-ownership
          fetch-depth: 0

      - name: Apply verified CWA mission expansion
        run: |
          python -m py_compile tools/finalize_all_cwa_probe.py
          python tools/finalize_all_cwa_probe.py

      - name: Run generalized structural guard
        run: python -m unittest tests/test_woodland_support_probe.py

      - name: Publish CWA mission changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource/map/multi tests/test_woodland_support_probe.py
          git commit -m "Expand DefenderBot ownership proof across CWA maps"
          git push origin HEAD:prototype/all-cwa-defenderbot-ownership
