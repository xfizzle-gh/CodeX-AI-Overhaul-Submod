name: Expand CWA ownership probe

on:
  pull_request:
    paths:
      - "tools/expand_cwa_ownership_probe.py"
      - ".github/workflows/expand-cwa-ownership-probe.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v6
        with:
          ref: prototype/woodland-defenderbot-ownership
          fetch-depth: 0

      - name: Expand probe to all CWA missions
        run: |
          python -m py_compile tools/expand_cwa_ownership_probe.py
          python tools/expand_cwa_ownership_probe.py

      - name: Run expanded source guard
        run: python -m unittest tests/test_woodland_support_probe.py

      - name: Publish CWA map expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource/map/multi tests/test_woodland_support_probe.py
          git commit -m "Expand DefenderBot ownership proof to all CWA maps"
          git push origin HEAD:prototype/woodland-defenderbot-ownership
