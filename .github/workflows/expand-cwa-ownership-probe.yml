name: Expand CWA ownership probe

on:
  pull_request:
    paths:
      - "tools/expand_cwa_ownership_probe.py"
      - ".github/workflows/expand-cwa-ownership-probe.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out expansion branch
        uses: actions/checkout@v6
        with:
          ref: prototype/all-cwa-defenderbot-ownership
          fetch-depth: 0

      - name: Expand probe across CWA missions
        id: expand
        run: |
          set +e
          {
            python -m py_compile tools/expand_cwa_ownership_probe.py
            python tools/expand_cwa_ownership_probe.py
          } > cwa-expansion-error.txt 2>&1
          status=$?
          cat cwa-expansion-error.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist generator failure
        if: steps.expand.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          mv cwa-expansion-error.txt docs/cwa-expansion-error.txt
          git add docs/cwa-expansion-error.txt
          git commit -m "Record CWA expansion generator failure"
          git push origin HEAD:prototype/all-cwa-defenderbot-ownership

      - name: Stop after captured failure
        if: steps.expand.outputs.status != '0'
        run: exit 1

      - name: Run expanded structural tests
        if: steps.expand.outputs.status == '0'
        run: python -m unittest tests/test_woodland_support_probe.py

      - name: Publish map expansion
        if: steps.expand.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource/map/multi tests/test_woodland_support_probe.py
          git commit -m "Expand DefenderBot ownership proof to all CWA maps"
          git push origin HEAD:prototype/all-cwa-defenderbot-ownership
