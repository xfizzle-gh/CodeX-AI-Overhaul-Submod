name: Apply motor package checkpoint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'experiment/attack-mate-slot-proof' || github.ref_name == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0
      - name: Convert motor packages 2-4 to linked riders
        shell: bash
        run: |
          cat > /tmp/convert_motor.py <<'PY'
          from pathlib import Path
          import re, json
          repo=Path('.')
          p=repo/'resource/map/multi/faction_support_templates.inc'
          s=p.read_text()
          lines=s.splitlines(keepends=True)
          actors={}
          for i,l in enumerate(lines):
           m=re.match(r'\s*\{(Entity|Human)\s+"([^"]+)"\s+(0x[0-9a-fA-F]+)',l)
           if m: actors[m.group(3).lower()]={'kind':m.group(1),'name':m.group(2),'line':i,'tagline':None,'tags':set()}
          for i,l in enumerate(lines):
           if '{Tags ' not in l: continue
           m=re.search(r'(0x[0-9a-fA-F]+)\s*\}\s*$',l)
           if m and m.group(1).lower() in actors:
            a=actors[m.group(1).lower()]; a['tagline']=i; a['tags']=set(re.findall(r'"([^"]+)"',l))
          links=[]
          for i,l in enumerate(lines):
           m=re.match(r'\s*\{Link\s+(0x[0-9a-fA-F]+)\s+\{(0x[0-9a-fA-F]+)\s+"([^"]+)"\}\s*\}',l)
           if m: links.append((i,m.group(1).lower(),m.group(2).lower(),m.group(3)))
          linked={x[1] for x in links}
          factions=('rusa','ukr','nato','prc'); expected={2:4,3:6,4:6}
          def haspkg(tags,fac,n,kind): return f'ally_sup_{fac}_p{n}_{kind}' in tags
          packages={}
          for fac in factions:
           for n in (1,2,3,4):
            hull=[(aid,a) for aid,a in actors.items() if a['kind']=='Entity' and haspkg(a['tags'],fac,n,'hull')]
            if len(hull)!=1: raise RuntimeError((fac,n,'hull',hull))
            packages[(fac,n)]=hull[0][0]
          seats={}
          for fac in factions:
           h=packages[(fac,1)]
           ps=[pl for _,_,par,pl in links if par==h and pl not in ('driver','commander','gunner')]
           ps=sorted(set(ps),key=lambda x:int(re.search(r'\d+$',x).group()))
           if len(ps)<8: raise RuntimeError((fac,ps))
           seats[fac]=ps
          new=[]; taglines=[]; report={}
          for fac in factions:
           for n in (2,3,4):
            pax=[(a['line'],aid,a) for aid,a in actors.items() if a['kind']=='Human' and aid not in linked and haspkg(a['tags'],fac,n,'pax')]
            pax.sort(); want=expected[n]
            if len(pax)!=want: raise RuntimeError((fac,n,len(pax),[(x[1],x[2]['tags']) for x in pax]))
            for (_,aid,a),seat in zip(pax,seats[fac][:want]):
             new.append((aid,packages[(fac,n)],seat))
             if a['tagline'] is None: raise RuntimeError(('no tags',aid))
             taglines.append(a['tagline'])
            report[f'{fac}_p{n}']={'hull':packages[(fac,n)],'pax':[x[1] for x in pax],'seats':seats[fac][:want]}
          if len(new)!=64: raise RuntimeError(len(new))
          for idx in sorted(set(taglines)):
           l=lines[idx]
           if '"sup_linked"' in l: continue
           if '"hidden"' not in l: raise RuntimeError(('missing hidden',idx,l))
           lines[idx]=l.replace('"hidden"','"sup_linked" "hidden"',1)
          last=max(i for i,_,_,_ in links); indent=re.match(r'\s*',lines[last]).group()
          added=[f'{indent}{{Link {child} {{{parent} "{seat}"}}}}\n' for child,parent,seat in new]
          lines[last+1:last+1]=added
          p.write_text(''.join(lines))
          pt=repo/'tests/test_attack_support_slot_proof.py'; t=pt.read_text()
          old='self.assertEqual(total, 125)'
          if old not in t: raise RuntimeError('missing total pin')
          t=t.replace('117 in the faction pools (motor, IFV, light vehicle, E2 aircrew) plus the\n        # 8 humvee crew in the original attack pool.\n        self.assertEqual(total, 125)',
          '''181 in the faction pools (including all four motor packages, IFV, light vehicle, E2 aircrew) plus the
                  # 8 humvee crew in the original attack pool.
                  self.assertEqual(total, 189)''')
          pt.write_text(t)
          Path('/tmp/motor_conversion_report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({'links_added':len(new),'packages':report},indent=2))
          PY
          python /tmp/convert_motor.py
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run focused structural tests
        run: python -m pytest tests/test_attack_support_slot_proof.py -q -k 'sup_linked or motor or package or link'
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/agent-repo-export.yml
          rm -f .github/workflows/agent-apply-motor.yml
          rm -f .github/workflows/agent-apply-helicopter.yml
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add resource/map/multi/faction_support_templates.inc tests/test_attack_support_slot_proof.py .github/workflows
          git commit -m 'Link-bake motor packages 2-4 riders'
          git push origin HEAD:experiment/attack-mate-slot-proof
