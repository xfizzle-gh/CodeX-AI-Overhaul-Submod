name: Export live debug branch

on:
  push:
    branches:
      - experiment/attack-mate-slot-proof
    paths:
      - .github/workflows/export-live-debug-branch.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact head
        run: git rev-parse HEAD > BRANCH_HEAD.txt
      - name: Package repository
        run: zip -qr current-branch-export.zip . -x '.git/*' 'current-branch-export.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: current-branch-export
          path: current-branch-export.zip
          if-no-files-found: error
          retention-days: 1
