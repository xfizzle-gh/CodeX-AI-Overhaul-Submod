name: Fix motor runtime isolation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-motor-runtime-isolation.yml
      - tools/fix_motor_lifecycle.py
      - tools/patch_motor_isolation_test.py
      - tools/patch_actual_motor_tests.py
      - tools/patch_package1_restore_test.py

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0

      - name: Apply isolated motor lifecycle repair
        run: |
          python -m py_compile tools/fix_motor_lifecycle.py
          python tools/fix_motor_lifecycle.py
          python -m py_compile tools/patch_motor_isolation_test.py
          python tools/patch_motor_isolation_test.py
          python -m py_compile tools/patch_actual_motor_tests.py
          python tools/patch_actual_motor_tests.py
          python -m py_compile tools/patch_package1_restore_test.py
          python tools/patch_package1_restore_test.py
          python -m py_compile tests/test_motor_runtime_isolation.py
          python -m py_compile tests/test_motor_package1_restore.py
          python -m py_compile tests/test_attack_support_slot_proof.py
          git diff --check

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused motor tests
        id: focused
        shell: bash
        run: |
          set +e
          : > focused-motor-failure.log
          python -m pytest tests/test_motor_runtime_isolation.py -vv 2>&1 | tee -a focused-motor-failure.log
          s1=${PIPESTATUS[0]}
          python -m pytest tests/test_motor_package1_restore.py -vv 2>&1 | tee -a focused-motor-failure.log
          s2=${PIPESTATUS[0]}
          python -m pytest tests/test_attack_support_slot_proof.py -vv -k 'motor or linked or package or flank' 2>&1 | tee -a focused-motor-failure.log
          s3=${PIPESTATUS[0]}
          if (( s1 != 0 || s2 != 0 || s3 != 0 )); then
            exit 1
          fi
          rm -f focused-motor-failure.log

      - name: Persist focused failure output
        if: failure() && steps.focused.outcome == 'failure'
        shell: bash
        run: |
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add focused-motor-failure.log
          git commit -m 'Temporary: capture focused motor failure'
          git push origin HEAD:experiment/attack-mate-slot-proof

      - name: Run hosted-compatible repository suite
        id: hosted
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -vv \
            --deselect=tests/test_attack_support_slot_proof.py::AttackSupportSlotProofTests::test_wave_pool_is_deep_enough_for_the_level_budget \
            --deselect=tests/test_enemy_defense_support.py::EnemyDefenseSupportTests::test_pool_parks_four_faction_pools_deep_enough_for_the_budget \
            2>&1 | tee hosted-suite-failure.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            exit 1
          fi
          rm -f hosted-suite-failure.log

      - name: Persist hosted-suite failure output
        if: failure() && steps.hosted.outcome == 'failure'
        shell: bash
        run: |
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add hosted-suite-failure.log
          git commit -m 'Temporary: capture hosted suite failure'
          git push origin HEAD:experiment/attack-mate-slot-proof

      - name: Commit clean repair
        shell: bash
        run: |
          rm -f .github/workflows/inspect-motor-runtime-regressions.yml
          rm -f .github/workflows/fix-motor-runtime-isolation.yml
          rm -f tools/fix_motor_lifecycle.py
          rm -f tools/patch_motor_isolation_test.py
          rm -f tools/patch_actual_motor_tests.py
          rm -f tools/patch_package1_restore_test.py
          rm -f tools/patch_existing_motor_tests.py
          rm -f tools/list_motor_test_names.py
          rm -f focused-motor-failure.log
          rm -f hosted-suite-failure.log
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add resource/map/multi/attack_support_waves.inc \
                  resource/map/multi/defense_support_waves.inc \
                  resource/map/multi/enemy_attack_support.inc \
                  resource/map/multi/enemy_defense_support.inc \
                  tests/test_motor_runtime_isolation.py \
                  tests/test_motor_package1_restore.py \
                  tests/test_attack_support_slot_proof.py \
                  .github/workflows tools focused-motor-failure.log hosted-suite-failure.log
          git commit -m 'Isolate motor passengers from infantry patrols'
          git push origin HEAD:experiment/attack-mate-slot-proof
