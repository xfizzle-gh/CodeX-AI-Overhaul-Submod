name: CWA live allied support guard

# Structural checks only. A real GoH defense test is required before merge.
on:
  pull_request:
    paths:
      - "resource/map/multi/allied_support_waves.inc"
      - "resource/map/multi/allied_support_templates.inc"
      - "resource/map/multi/allied_support_ownership_probe.inc"
      - "resource/map/multi/dcg_[[]cwa71]_*/campaign_capture_the_flag.mi"
      - "tests/test_woodland_support_probe.py"
      - ".github/workflows/woodland-support-probe-guard.yml"
  push:
    branches:
      - main
    paths:
      - "resource/map/multi/allied_support_waves.inc"
      - "resource/map/multi/allied_support_templates.inc"
      - "resource/map/multi/allied_support_ownership_probe.inc"
      - "resource/map/multi/dcg_[[]cwa71]_*/campaign_capture_the_flag.mi"
      - "tests/test_woodland_support_probe.py"
      - ".github/workflows/woodland-support-probe-guard.yml"

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest tests/test_woodland_support_probe.py
