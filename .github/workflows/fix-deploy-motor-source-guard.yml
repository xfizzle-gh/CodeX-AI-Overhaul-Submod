name: Fix deploy motor source guard

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-deploy-motor-source-guard.yml
      - tools/patch_deploy_motor_source_guard.py

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0

      - name: Apply deploy guard repair
        run: |
          python -m py_compile tools/patch_deploy_motor_source_guard.py
          python tools/patch_deploy_motor_source_guard.py
          python -m py_compile tests/test_motor_runtime_isolation.py
          git diff --check

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused deployment and motor tests
        run: |
          python -m pytest tests/test_motor_runtime_isolation.py tests/test_motor_package1_restore.py -q
          python -m pytest tests/test_attack_support_slot_proof.py -q -k 'motor or linked or package or flank or deploy'

      - name: Run hosted-compatible repository suite
        run: |
          python -m pytest tests/ -q \
            --deselect=tests/test_attack_support_slot_proof.py::AttackSupportSlotProofTests::test_wave_pool_is_deep_enough_for_the_level_budget \
            --deselect=tests/test_enemy_defense_support.py::EnemyDefenseSupportTests::test_pool_parks_four_faction_pools_deep_enough_for_the_budget

      - name: Publish clean repair
        shell: bash
        run: |
          rm -f .github/workflows/fix-deploy-motor-source-guard.yml
          rm -f tools/patch_deploy_motor_source_guard.py
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add tools/deploy_attack_support_probe.ps1 \
                  tests/test_motor_runtime_isolation.py \
                  .github/workflows/fix-deploy-motor-source-guard.yml \
                  tools/patch_deploy_motor_source_guard.py
          git commit -m 'Allow departing motor hull through deploy guard'
          git push origin HEAD:experiment/attack-mate-slot-proof
