name: Morale breed metadata guard

on:
  pull_request:
    paths:
      - "resource/set/breed/**"
      - "resource/set/stuff/special/aio_marker_*"
      - "docs/morale_command_classification.md"
      - "docs/morale_command_classification.tsv"
      - "docs/morale_command_phase0_audit.md"
      - "docs/morale_legacy_visual_allowlist.txt"
      - "tests/test_morale_breed_metadata.py"
      - "tests/test_generate_pow_mirrors.py"
      - "tests/test_aio_iso_civilian_behaviour.py"
      - "tools/generate_pow_mirrors.py"
      - "docs/pow_mirror_mapping.tsv"
      - "docs/pow_mirror_skip.tsv"
      - ".github/workflows/morale-breed-metadata-guard.yml"
  push:
    branches:
      - main
    paths:
      - "resource/set/breed/**"
      - "resource/set/stuff/special/aio_marker_*"
      - "docs/morale_command_classification.md"
      - "docs/morale_command_classification.tsv"
      - "docs/morale_command_phase0_audit.md"
      - "docs/morale_legacy_visual_allowlist.txt"
      - "tests/test_morale_breed_metadata.py"
      - "tests/test_generate_pow_mirrors.py"
      - "tests/test_aio_iso_civilian_behaviour.py"
      - "tools/generate_pow_mirrors.py"
      - "docs/pow_mirror_mapping.tsv"
      - "docs/pow_mirror_skip.tsv"
      - ".github/workflows/morale-breed-metadata-guard.yml"

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run repo-local morale metadata guard
        run: python -m unittest tests/test_morale_breed_metadata.py tests/test_generate_pow_mirrors.py tests/test_aio_iso_civilian_behaviour.py
