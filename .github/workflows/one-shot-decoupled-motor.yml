name: One-shot decoupled motor repair

on:
  push:
    branches:
      - experiment/attack-mate-slot-proof
    paths:
      - tools/apply_decoupled_motor_delivery.py
      - .github/workflows/one-shot-decoupled-motor.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_decoupled_motor_delivery.py
      - .github/workflows/one-shot-decoupled-motor.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pytest
      - name: Build corrected repair runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import zlib

          root = Path.cwd()
          payload = "".join(
              (root / "tools" / f".decoupled_payload_{i}.txt").read_text(encoding="ascii").strip()
              for i in range(1, 6)
          )
          source = zlib.decompress(base64.b64decode(payload)).decode("utf-8")
          source = source.replace(
              "ROOT = Path(__file__).resolve().parents[1]",
              "ROOT = Path.cwd()",
              1,
          )

          start = source.index("    topup_crew_ids = {")
          end = source.index("    text = link_re.sub(strip_topup_commander, text)", start)
          replacement = '''    # Generated top-up motor packages occupy 0xc100-0xc153. Base motors are
              # 0xb3xx and aircraft are 0xb4xx, so this range isolates only the twelve
              # numbered top-up trucks without relying on tag layout.
              def strip_topup_commander(match: re.Match[str]) -> str:
                  hull = int(match.group("hull"), 16)
                  body = int(match.group("body"), 16)
                  if not (0xC100 <= hull <= 0xC153 and 0xC100 <= body <= 0xC153):
                      return match.group(0)
                  if match.group("slot") == "commander":
                      commander_ids.add(match.group("body").lower())
                      return ""
                  return match.group(0)

          '''
          source = source[:start] + replacement + source[end:]

          # Use the actual define prefixes shipped by the four support engines.
          main_pos = source.index("def main(")
          prefixes = '''ENGINE_PREFIXES = {
              "resource/map/multi/attack_support_waves.inc": "as",
              "resource/map/multi/defense_support_waves.inc": "ds",
              "resource/map/multi/enemy_attack_support.inc": "ea",
              "resource/map/multi/enemy_defense_support.inc": "ed",
          }

          '''
          source = source[:main_pos] + prefixes + source[main_pos:]

          # Replace the old authentic-passenger test pins with the decoupled contract.
          main_pos = source.index("def main(")
          test_patch = r'''
def patch_tests() -> None:
    runtime_test = r"""from __future__ import annotations

import re
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
TEMPLATE = ROOT / "resource/map/multi/faction_support_templates.inc"
ENGINES = {
    "resource/map/multi/attack_support_waves.inc": "as",
    "resource/map/multi/defense_support_waves.inc": "ds",
    "resource/map/multi/enemy_attack_support.inc": "ea",
    "resource/map/multi/enemy_defense_support.inc": "ed",
}


def _define_block(text: str, name: str) -> str:
    start = text.index(f'(define "{name}"')
    depth = 0
    opened = False
    for index in range(start, len(text)):
        char = text[index]
        if char == "(":
            depth += 1
            opened = True
        elif char == ")":
            depth -= 1
            if opened and depth == 0:
                return text[start:index + 1]
    raise AssertionError(f"Unbalanced define: {name}")


def _motor_links(text: str) -> list[tuple[int, int, str]]:
    link_re = re.compile(
        r'\{Link\s+(0x[0-9a-fA-F]+)\s+\{(0x[0-9a-fA-F]+)\s+"([^"]+)"\}\}'
    )
    result: list[tuple[int, int, str]] = []
    for body_raw, hull_raw, slot in link_re.findall(text):
        body = int(body_raw, 16)
        hull = int(hull_raw, 16)
        base = 0xB3A0 <= hull <= 0xB3CB and 0xB3A0 <= body <= 0xB3CB
        topup = 0xC100 <= hull <= 0xC153 and 0xC100 <= body <= 0xC153
        if base or topup:
            result.append((body, hull, slot))
    return result


class MotorRuntimeIsolationTests(unittest.TestCase):
    def test_motor_core_runs_on_all_four_engines(self) -> None:
        for relative, prefix in ENGINES.items():
            with self.subTest(relative=relative):
                text = (ROOT / relative).read_text(encoding="utf-8")
                block = _define_block(text, f"{prefix}_finish_motor")
                self.assertIn("DECOUPLED MOTOR DELIVERY", block)
                self.assertIn("NO PASSENGER LINK OR EMIT DEPENDENCY", block)
                self.assertIn("BOUNDED INFANTRY RELEASE INDEPENDENT OF TRUCK", block)
                self.assertIn(f"{prefix}_motor_hull", block)
                self.assertIn(f"{prefix}_motor_crew", block)
                self.assertIn(f"{prefix}_motor_pax", block)
                self.assertIn(f"{prefix}_motor_flag", block)

    def test_release_is_independent_of_vehicle_occupancy_and_emit(self) -> None:
        for relative, prefix in ENGINES.items():
            with self.subTest(relative=relative):
                text = (ROOT / relative).read_text(encoding="utf-8")
                block = _define_block(text, f"{prefix}_finish_motor")
                self.assertNotIn("{state inhabited}", block)
                self.assertNotIn("{emit", block)
                self.assertNotIn("emit {mode passengers}", block)
                self.assertGreaterEqual(block.count('{"delay" {time 7}}'), 4)
                self.assertIn("attack_support_air_", block)
                placement = block.index('{"placement"')
                advance = block.index("{action advance}", placement)
                self.assertLess(placement, advance)

    def test_truck_uses_vehicle_move_and_infantry_uses_advance(self) -> None:
        for relative, prefix in ENGINES.items():
            with self.subTest(relative=relative):
                text = (ROOT / relative).read_text(encoding="utf-8")
                block = _define_block(text, f"{prefix}_finish_motor")
                move = block.index("{action move}")
                release = block.index("BOUNDED INFANTRY RELEASE INDEPENDENT OF TRUCK")
                advance = block.index("{action advance}", release)
                self.assertLess(move, release)
                self.assertLess(release, advance)
                self.assertIn('{"set_i" {var "' + prefix + '_motor_stage$"} {op "="} {value 5}}', block)
                self.assertIn('{"set_i" {var "' + prefix + '_motor_stage$"} {op "="} {value 0}}', block)

    def test_templates_link_only_one_driver_per_motor_package(self) -> None:
        text = TEMPLATE.read_text(encoding="utf-8")
        links = _motor_links(text)
        self.assertEqual(sum(slot == "driver" for _, _, slot in links), 16)
        self.assertEqual(sum(slot == "commander" for _, _, slot in links), 0)
        self.assertEqual(sum(slot.startswith("seat") for _, _, slot in links), 0)

    def test_motor_passengers_are_loose_hidden_packages(self) -> None:
        text = TEMPLATE.read_text(encoding="utf-8")
        lines = text.splitlines()
        pax_lines = [
            line for line in lines
            if re.search(r'ally_sup_(?:rusa|ukr|nato|prc)_p[1-4]_pax', line)
        ]
        self.assertTrue(pax_lines)
        self.assertTrue(all("sup_linked" not in line for line in pax_lines))
        for faction in ("rusa", "ukr", "nato", "prc"):
            for package in range(1, 5):
                tag = f'ally_sup_{faction}_p{package}_crew'
                linked = [line for line in lines if tag in line and "sup_linked" in line]
                self.assertEqual(len(linked), 1, f"{tag} must name exactly one linked driver")


if __name__ == "__main__":
    unittest.main()
"""

    package_test = r"""from __future__ import annotations

import re
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
TEMPLATE = ROOT / "resource/map/multi/faction_support_templates.inc"
FACTIONS = ("rusa", "ukr", "nato", "prc")


class MotorPackageOneRestoreTests(unittest.TestCase):
    @classmethod
    def setUpClass(cls) -> None:
        cls.text = TEMPLATE.read_text(encoding="utf-8")
        cls.lines = cls.text.splitlines()

    def test_all_numbered_motor_packages_exist(self) -> None:
        for faction in FACTIONS:
            for package in range(1, 5):
                self.assertIn(f'ally_sup_{faction}_p{package}_hull', self.text)
                self.assertIn(f'ally_sup_{faction}_p{package}_crew', self.text)
                self.assertIn(f'ally_sup_{faction}_p{package}_pax', self.text)

    def test_each_package_has_one_linked_driver(self) -> None:
        for faction in FACTIONS:
            for package in range(1, 5):
                tag = f'ally_sup_{faction}_p{package}_crew'
                lines = [line for line in self.lines if tag in line]
                linked = [line for line in lines if "sup_linked" in line]
                self.assertEqual(len(linked), 1, f"{tag} must have one linked driver")

    def test_passenger_tags_are_never_linked(self) -> None:
        for faction in FACTIONS:
            for package in range(1, 5):
                tag = f'ally_sup_{faction}_p{package}_pax'
                lines = [line for line in self.lines if tag in line]
                self.assertTrue(lines, tag)
                self.assertTrue(all("sup_linked" not in line for line in lines), tag)

    def test_motor_link_table_has_no_passenger_or_commander_slots(self) -> None:
        link_re = re.compile(
            r'\{Link\s+(0x[0-9a-fA-F]+)\s+\{(0x[0-9a-fA-F]+)\s+"([^"]+)"\}\}'
        )
        slots: list[str] = []
        for body_raw, hull_raw, slot in link_re.findall(self.text):
            body = int(body_raw, 16)
            hull = int(hull_raw, 16)
            base = 0xB3A0 <= hull <= 0xB3CB and 0xB3A0 <= body <= 0xB3CB
            topup = 0xC100 <= hull <= 0xC153 and 0xC100 <= body <= 0xC153
            if base or topup:
                slots.append(slot)
        self.assertEqual(slots.count("driver"), 16)
        self.assertNotIn("commander", slots)
        self.assertFalse(any(slot.startswith("seat") for slot in slots))


if __name__ == "__main__":
    unittest.main()
"""

    (ROOT / "tests/test_motor_runtime_isolation.py").write_text(runtime_test, encoding="utf-8")
    (ROOT / "tests/test_motor_package1_restore.py").write_text(package_test, encoding="utf-8")
    print("Test patch complete: decoupled architecture is pinned.")


'''
          source = source[:main_pos] + test_patch + source[main_pos:]

          compile(source, ".git/decoupled_motor_runtime.py", "exec")
          (root / ".git" / "decoupled_motor_runtime.py").write_text(source, encoding="utf-8")
          PY
      - run: python .git/decoupled_motor_runtime.py
