name: One-shot decoupled motor repair

on:
  push:
    branches:
      - experiment/attack-mate-slot-proof
    paths:
      - tools/apply_decoupled_motor_delivery.py
      - .github/workflows/one-shot-decoupled-motor.yml
      - tools/decoupled_test_motor_runtime.py
      - tools/decoupled_test_motor_package1.py
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_decoupled_motor_delivery.py
      - .github/workflows/one-shot-decoupled-motor.yml
      - tools/decoupled_test_motor_runtime.py
      - tools/decoupled_test_motor_package1.py

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pytest
      - name: Build corrected repair runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import zlib

          root = Path.cwd()
          payload = "".join(
              (root / "tools" / f".decoupled_payload_{i}.txt").read_text(encoding="ascii").strip()
              for i in range(1, 6)
          )
          source = zlib.decompress(base64.b64decode(payload)).decode("utf-8")
          source = source.replace(
              "ROOT = Path(__file__).resolve().parents[1]",
              "ROOT = Path.cwd()",
              1,
          )

          start = source.index("    topup_crew_ids = {")
          end = source.index("    text = link_re.sub(strip_topup_commander, text)", start)
          replacement = '''    # Generated top-up motor packages occupy 0xc100-0xc153. Base motors are
              # 0xb3xx and aircraft are 0xb4xx, so this range isolates only the twelve
              # numbered top-up trucks without relying on tag layout.
              def strip_topup_commander(match: re.Match[str]) -> str:
                  hull = int(match.group("hull"), 16)
                  body = int(match.group("body"), 16)
                  if not (0xC100 <= hull <= 0xC153 and 0xC100 <= body <= 0xC153):
                      return match.group(0)
                  if match.group("slot") == "commander":
                      commander_ids.add(match.group("body").lower())
                      return ""
                  return match.group(0)

          '''
          source = source[:start] + replacement + source[end:]

          main_pos = source.index("def main(")
          overrides = '''ENGINE_PREFIXES = {
              "resource/map/multi/attack_support_waves.inc": "as",
              "resource/map/multi/defense_support_waves.inc": "ds",
              "resource/map/multi/enemy_attack_support.inc": "ea",
              "resource/map/multi/enemy_defense_support.inc": "ed",
          }

          def restore_decoupled_tests() -> None:
              fixtures = {
                  "tools/decoupled_test_motor_runtime.py": "tests/test_motor_runtime_isolation.py",
                  "tools/decoupled_test_motor_package1.py": "tests/test_motor_package1_restore.py",
              }
              for source_path, destination_path in fixtures.items():
                  content = (ROOT / source_path).read_text(encoding="utf-8")
                  (ROOT / destination_path).write_text(content, encoding="utf-8")
              print("Test patch complete: decoupled architecture is pinned.")

          '''
          source = source[:main_pos] + overrides + source[main_pos:]
          needle = "    patch_tests()\n"
          if needle not in source:
              raise RuntimeError("Could not locate patch_tests call")
          source = source.replace(
              needle,
              "    patch_tests()\n    restore_decoupled_tests()\n",
              1,
          )

          compile(source, ".git/decoupled_motor_runtime.py", "exec")
          (root / ".git" / "decoupled_motor_runtime.py").write_text(source, encoding="utf-8")
          PY
      - run: python .git/decoupled_motor_runtime.py
