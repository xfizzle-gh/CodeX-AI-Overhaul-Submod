name: Apply allied DefenderBot runtime patch

on:
  push:
    branches:
      - agent/dcg-allied-defender-waves
    paths:
      - tools/apply_dcg_allied_defender_patch.py
      - .github/workflows/apply-dcg-allied-defender-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: agent/dcg-allied-defender-waves
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python tools/apply_dcg_allied_defender_patch.py

      - name: Commit final runtime change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Patch produced no changes"
            exit 1
          fi
          git commit -m "Add engine-owned allied DefenderBot support waves"
          git push origin HEAD:agent/dcg-allied-defender-waves
