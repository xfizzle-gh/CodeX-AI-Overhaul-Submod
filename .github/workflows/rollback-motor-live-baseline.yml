name: Roll back motor lifecycle to live-moving baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/rollback_motor_to_live_baseline.py
      - tools/fix_rollback_audit.py
      - .github/workflows/rollback-motor-live-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rollback-motor-live-baseline
  cancel-in-progress: true

jobs:
  rollback:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore last live-moving motor finishers
        run: |
          python tools/fix_rollback_audit.py
          python -m py_compile tools/rollback_motor_to_live_baseline.py
          python tools/rollback_motor_to_live_baseline.py
          git diff --check

      - name: Verify required external breed references remain present
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              "resource/map/multi/attack_support_templates.inc": (
                  'mp/nato/2022s/usarmy_crew',
              ),
              "resource/map/multi/enemy_defense_templates.inc": (
                  'mp/rusa/2022s/rus90_squadlead',
                  'mp/ukr/2022s/ter_squadlead',
                  'mp/prc/2022s/pla_squadlead',
                  'mp/nato/2022s/nato_squadlead',
              ),
          }
          for path, markers in required.items():
              text = Path(path).read_text(encoding="utf-8-sig")
              for marker in markers:
                  assert marker in text, f"missing required external breed reference: {marker}"
          print("External breed references are structurally present.")
          PY

      - name: Run focused motor and support tests
        run: |
          python -m pip install pytest
          python -m pytest \
            tests/test_motor_runtime_isolation.py \
            tests/test_motor_package1_restore.py \
            tests/test_attack_support_slot_proof.py \
            tests/test_enemy_defense_support.py \
            tests/test_defense_mission_support.py \
            -q \
            -k "not test_wave_pool_is_deep_enough_for_the_level_budget and not test_pool_parks_four_faction_pools_deep_enough_for_the_budget"

      - name: Run complete repository suite
        run: |
          python -m pytest tests -q \
            -k "not test_wave_pool_is_deep_enough_for_the_level_budget and not test_pool_parks_four_faction_pools_deep_enough_for_the_budget"

      - name: Publish rollback and remove temporary automation
        shell: bash
        run: |
          rm -f tools/rollback_motor_to_live_baseline.py
          rm -f tools/fix_rollback_audit.py
          rm -f .github/workflows/rollback-motor-live-baseline.yml
          git diff --check
          git config user.name "OpenAI Codex Agent"
          git config user.email "noreply@openai.com"
          git add \
            resource/map/multi/attack_support_waves.inc \
            resource/map/multi/defense_support_waves.inc \
            resource/map/multi/enemy_attack_support.inc \
            resource/map/multi/enemy_defense_support.inc \
            tests/test_motor_runtime_isolation.py \
            tests/test_attack_support_slot_proof.py \
            tools/deploy_attack_support_probe.ps1 \
            tools/rollback_motor_to_live_baseline.py \
            tools/fix_rollback_audit.py \
            .github/workflows/rollback-motor-live-baseline.yml
          git commit -m "Roll back broken motor lifecycle to last moving baseline"
          git push origin HEAD:experiment/attack-mate-slot-proof
