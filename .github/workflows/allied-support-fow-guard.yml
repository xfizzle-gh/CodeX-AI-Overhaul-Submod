name: Allied Support FoW and Mission Gate guard

on:
  pull_request:
    paths:
      - "resource/script/multiplayer/bot.main.lua"
      - "resource/script/multiplayer/modes/attack_support.lua"
      - "resource/script/multiplayer/modes/native_support_fow_test.lua"
      - "resource/set/multiplayer/units/conquest/native_support_test_rusa.set"
      - "resource/map/multi/attack_support_waves.inc"
      - "resource/map/multi/defense_support_waves.inc"
      - "resource/map/multi/enemy_defense_support.inc"
      - "resource/map/multi/enemy_attack_support.inc"
      - "tests/test_allied_support_shared_fow.py"
      - "tests/test_native_support_fow.py"
      - "tests/test_tmai_support_commander.py"
      - "tests/test_conquest_defender_bot.py"
      - "tests/test_woodland_support_probe.py"
      - "docs/research/native-support-fow-test.md"
      - "docs/research/tmai-allied-support-commander.md"
      - ".github/workflows/allied-support-fow-guard.yml"
  push:
    branches:
      - main
      - test/support-shared-fow-100pct
      - research/tmai-native-support-fow
      - research/tmai-allied-support-commander
    paths:
      - "resource/script/multiplayer/bot.main.lua"
      - "resource/script/multiplayer/modes/attack_support.lua"
      - "resource/script/multiplayer/modes/native_support_fow_test.lua"
      - "resource/set/multiplayer/units/conquest/native_support_test_rusa.set"
      - "resource/map/multi/attack_support_waves.inc"
      - "resource/map/multi/defense_support_waves.inc"
      - "resource/map/multi/enemy_defense_support.inc"
      - "resource/map/multi/enemy_attack_support.inc"
      - "tests/test_allied_support_shared_fow.py"
      - "tests/test_native_support_fow.py"
      - "tests/test_tmai_support_commander.py"
      - "tests/test_conquest_defender_bot.py"
      - "tests/test_woodland_support_probe.py"
      - "docs/research/native-support-fow-test.md"
      - "docs/research/tmai-allied-support-commander.md"
      - ".github/workflows/allied-support-fow-guard.yml"

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run allied-support ownership and mission-gate regression
        run: python tests/test_allied_support_shared_fow.py

      - name: Run native support FoW diagnostic regression
        run: python tests/test_native_support_fow.py

      - name: Run TMAI-referenced support commander regression
        run: python tests/test_tmai_support_commander.py

      - name: Run DefenderBot Conquest regression
        run: python tests/test_conquest_defender_bot.py

      - name: Run CWA mission-integrity regression
        run: python tests/test_woodland_support_probe.py
