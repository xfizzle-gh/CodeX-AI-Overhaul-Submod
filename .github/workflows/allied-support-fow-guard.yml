name: Allied Support FoW and Mission Gate guard

on:
  pull_request:
    paths:
      - "resource/script/multiplayer/modes/attack_support.lua"
      - "resource/set/multiplayer/units/conquest/codex_native_support_rusa.set"
      - "resource/map/multi/attack_support_waves.inc"
      - "tests/test_native_stage0_support_fow.py"
      - "tests/test_attack_support_ifv_transport_policy.py"
      - ".github/workflows/allied-support-fow-guard.yml"
  push:
    branches:
      - main
      - test/support-shared-fow-100pct
      - research/mate-stage0-native-support-fow
    paths:
      - "resource/script/multiplayer/modes/attack_support.lua"
      - "resource/set/multiplayer/units/conquest/codex_native_support_rusa.set"
      - "resource/map/multi/attack_support_waves.inc"
      - "tests/test_native_stage0_support_fow.py"
      - "tests/test_attack_support_ifv_transport_policy.py"
      - ".github/workflows/allied-support-fow-guard.yml"

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run native stage-zero FoW regression
        run: |
          python -m unittest tests/test_native_stage0_support_fow.py
          python -m unittest tests/test_attack_support_ifv_transport_policy.py
