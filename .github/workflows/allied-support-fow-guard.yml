name: Allied Support Terrain FoW patch validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-once:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: fix/allied-support-terrain-fow
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply terrain FoW patch
        run: python tools/patch_allied_support_terrain_fow.py

      - name: Run focused FoW regression suite
        run: python -m unittest tests/test_allied_support_shared_fow.py

      - name: Commit validated source changes
        run: |
          git show origin/main:.github/workflows/allied-support-fow-guard.yml > .github/workflows/allied-support-fow-guard.yml
          rm tools/patch_allied_support_terrain_fow.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Test player terrain FoW handoff for allied support"
          git push origin HEAD:fix/allied-support-terrain-fow
