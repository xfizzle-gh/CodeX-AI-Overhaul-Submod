name: Apply woodland DefenderBot ownership probe

on:
  pull_request:
    paths:
      - "tools/apply_woodland_support_probe.py"
      - ".github/workflows/apply-woodland-support-probe.yml"

permissions:
  contents: write

jobs:
  apply-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v6
        with:
          ref: prototype/woodland-defenderbot-ownership
          fetch-depth: 0

      - name: Apply guarded one-shot prototype
        run: |
          rm -f docs/woodland_probe_builder_error.txt
          python tools/apply_woodland_support_probe.py

      - name: Run woodland source guard
        run: python -m unittest tests/test_woodland_support_probe.py

      - name: Attempt final publication
        id: publish
        run: |
          set +e
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add woodland DefenderBot ownership probe"
            git pull --rebase origin prototype/woodland-defenderbot-ownership
            git push origin HEAD:prototype/woodland-defenderbot-ownership
          } > woodland-probe-publish.log 2>&1
          status=$?
          cat woodland-probe-publish.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload publication diagnostics
        if: steps.publish.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: woodland-probe-publish-log
          path: woodland-probe-publish.log

      - name: Fail on publication error
        if: steps.publish.outputs.status != '0'
        run: exit 1
