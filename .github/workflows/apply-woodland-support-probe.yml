name: Apply woodland DefenderBot ownership probe

on:
  pull_request:
    paths:
      - ".github/workflows/apply-woodland-support-probe.yml"

permissions:
  contents: write

jobs:
  apply-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v6
        with:
          ref: prototype/woodland-defenderbot-ownership
          fetch-depth: 0

      - name: Apply guarded one-shot prototype
        run: |
          rm -f docs/woodland_probe_builder_error.txt woodland-probe-publish.log
          python tools/apply_woodland_support_probe.py
          git checkout -- .github/workflows/apply-woodland-support-probe.yml
          rm -f .github/workflows/woodland-support-probe-guard.yml

      - name: Run woodland source guard
        run: python -m unittest tests/test_woodland_support_probe.py

      - name: Publish gameplay prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add woodland DefenderBot ownership probe"
          git push origin HEAD:prototype/woodland-defenderbot-ownership
