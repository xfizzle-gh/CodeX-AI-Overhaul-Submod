name: Audit MI stage selection

on:
  push:
    branches:
      - prototype/woodland-defenderbot-ownership
    paths:
      - "tools/audit_mi_stage_selection.py"
      - ".github/workflows/audit-mi-stage-selection.yml"

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message != 'Record MI stage-selection audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v6
        with:
          ref: prototype/woodland-defenderbot-ownership
          fetch-depth: 0

      - name: Extract stage-selection syntax
        run: python tools/audit_mi_stage_selection.py

      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record MI stage-selection audit"
          git push origin HEAD:prototype/woodland-defenderbot-ownership
