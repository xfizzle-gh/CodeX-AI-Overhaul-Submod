name: Restore live-proven motor package 1

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/restore-live-proven-motor-p1.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0

      - name: Restore package-1-only motor contract
        shell: python
        run: |
          from pathlib import Path
          import re

          files = {
              'resource/map/multi/attack_support_waves.inc': ('as_finish_motor', 'attack_support_motor_pax', 'attack_support/ally_'),
              'resource/map/multi/defense_support_waves.inc': ('ds_finish_motor', 'def_sup_motor_pax', 'defense_support/ally_'),
              'resource/map/multi/enemy_attack_support.inc': ('ea_finish_motor', 'ea_motor_pax', 'enemy_attack/'),
              'resource/map/multi/enemy_defense_support.inc': ('ed_finish_motor', 'enemy_def_motor_pax', 'enemy_defense/'),
          }
          factions = ('rusa', 'ukr', 'nato', 'prc')

          def balanced_paren(text: str, token: str) -> tuple[int, int, str]:
              start = text.index(token)
              depth = 0
              quoted = False
              escaped = False
              for index in range(start, len(text)):
                  char = text[index]
                  if quoted:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == '"':
                          quoted = False
                      continue
                  if char == '"':
                      quoted = True
                  elif char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          return start, index + 1, text[start:index + 1]
              raise RuntimeError(f'unbalanced block: {token}')

          def replace_block(text: str, token: str, transform) -> str:
              start, end, block = balanced_paren(text, token)
              changed = transform(block)
              if changed == block:
                  raise RuntimeError(f'no change made in {token}')
              return text[:start] + changed + text[end:]

          for path, (finisher_name, pax_tag, trigger_prefix) in files.items():
              source = Path(path).read_text(encoding='utf-8')

              # Restore the literal selector used by the two live-proven package-1 runs.
              # The later advanced state filter is structurally reasonable but was never
              # live-proven and accompanied the regression where riders appeared outside.
              def restore_finisher(block: str) -> str:
                  pattern = re.compile(
                      r'\{selector\s*\n\s*\{source advanced\}\s*\n'
                      r'\s*\{ignore_captured_by_user 0\}\s*\n'
                      r'\s*\{group\s*\n'
                      r'\s*\{select \{tag \{tag ' + re.escape(pax_tag) + r'\}\}\}\s*\n'
                      r'\s*\{exclude \{state \{state linked\}\} \{state \{state inactive\}\} \{state \{state dead\}\}\s*\n'
                      r'\s*\}\s*\n\s*\}'
                  )
                  replacement = '{selector {ignore_captured_by_user 0} {tag ' + pax_tag + '}}'
                  changed, count = pattern.subn(replacement, block)
                  if count != 1:
                      raise RuntimeError(f'{path}:{finisher_name}: expected one advanced pax selector, found {count}')
                  return changed

              source = replace_block(source, f'(define "{finisher_name}"', restore_finisher)

              # Keep packages 2-4 parked but unreachable. Each faction trigger must prove
              # that its original p1 hull is still available before entering the package
              # switch. Once p1 is consumed, the trigger cannot fall through to p2-p4.
              for faction in factions:
                  trigger_name = f'{trigger_prefix}{faction}_motor'
                  token = '{"' + trigger_name + '"'
                  def pin_p1(block: str, faction=faction, trigger_name=trigger_name) -> str:
                      generic = f'{{selector {{tag ally_sup_{faction}_motor_hull}}}}'
                      package1 = f'{{selector {{tag ally_sup_{faction}_p1_hull}}}}'
                      count = block.count(generic)
                      if count != 1:
                          raise RuntimeError(f'{path}:{trigger_name}: expected one generic hull gate, found {count}')
                      return block.replace(generic, package1, 1)
                  source = replace_block(source, token, pin_p1)

              Path(path).write_text(source, encoding='utf-8')

          test = r'''from __future__ import annotations

from pathlib import Path
import re

ROOT = Path(__file__).resolve().parents[1]
FACTIONS = ("rusa", "ukr", "nato", "prc")
ENGINES = {
    "resource/map/multi/attack_support_waves.inc": ("as_finish_motor", "attack_support_motor_pax", "attack_support/ally_"),
    "resource/map/multi/defense_support_waves.inc": ("ds_finish_motor", "def_sup_motor_pax", "defense_support/ally_"),
    "resource/map/multi/enemy_attack_support.inc": ("ea_finish_motor", "ea_motor_pax", "enemy_attack/"),
    "resource/map/multi/enemy_defense_support.inc": ("ed_finish_motor", "enemy_def_motor_pax", "enemy_defense/"),
}


def block(text: str, token: str) -> str:
    start = text.index(token)
    depth = 0
    quoted = False
    escaped = False
    for index in range(start, len(text)):
        char = text[index]
        if quoted:
            if escaped:
                escaped = False
            elif char == "\\":
                escaped = True
            elif char == '"':
                quoted = False
            continue
        if char == '"':
            quoted = True
        elif char == "(":
            depth += 1
        elif char == ")":
            depth -= 1
            if depth == 0:
                return text[start:index + 1]
    raise AssertionError(token)


def test_motor_triggers_are_package1_only() -> None:
    for relative, (_, _, prefix) in ENGINES.items():
        text = (ROOT / relative).read_text(encoding="utf-8")
        for faction in FACTIONS:
            trigger = block(text, '{"' + prefix + faction + '_motor"')
            condition = trigger.split('{actions', 1)[0]
            assert f'{{selector {{tag ally_sup_{faction}_p1_hull}}}}' in condition
            assert f'{{selector {{tag ally_sup_{faction}_motor_hull}}}}' not in condition


def test_finishers_use_the_live_proven_passenger_selector() -> None:
    for relative, (finisher, pax, _) in ENGINES.items():
        text = (ROOT / relative).read_text(encoding="utf-8")
        body = block(text, f'(define "{finisher}"')
        assert f'{{selector {{ignore_captured_by_user 0}} {{tag {pax}}}}' in body
        assert f'{{select {{tag {{tag {pax}}}}}}' not in body


def test_russian_package1_is_still_a_loaded_ural() -> None:
    text = (ROOT / "resource/map/multi/faction_support_templates.inc").read_text(encoding="utf-8")
    ids = set(re.findall(r'\{Tags [^\n]*"ally_sup_rusa_p1_[^"]+"[^\n]*(0x[0-9a-fA-F]+)\}', text))
    assert ids == {"0xb3a0", "0xb3a1", "0xb3a2", "0xb3a3", "0xb3a4", "0xb3a5", "0xb3a6", "0xb3a7", "0xb3a8", "0xb3a9", "0xb3aa"}
    assert '{Entity "ural" 0xb3a0' in text
    expected = {
        ('0xb3a1', 'driver'), ('0xb3a2', 'commander'),
        ('0xb3a3', 'seat1'), ('0xb3a4', 'seat2'), ('0xb3a5', 'seat3'), ('0xb3a6', 'seat4'),
        ('0xb3a7', 'seat5'), ('0xb3a8', 'seat6'), ('0xb3a9', 'seat7'), ('0xb3aa', 'seat8'),
    }
    actual = set(re.findall(r'\{Link (0xb3a[1-9a]) \{0xb3a0 "([^"]+)"\}\}', text))
    assert actual == expected
'''
          Path('tests/test_motor_package1_restore.py').write_text(test, encoding='utf-8')

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused motor validation
        run: |
          python -m pytest tests/test_motor_package1_restore.py -q
          python -m pytest tests/test_attack_support_slot_proof.py -q -k 'motor or linked or package'
          git diff --check

      - name: Run hosted-compatible repository suite
        run: |
          python -m pytest tests/ -q \
            --deselect=tests/test_attack_support_slot_proof.py::AttackSupportSlotProofTests::test_wave_pool_is_deep_enough_for_the_level_budget \
            --deselect=tests/test_enemy_defense_support.py::EnemyDefenseSupportTests::test_pool_parks_four_faction_pools_deep_enough_for_the_budget

      - name: Commit clean restoration
        shell: bash
        run: |
          rm -f .github/workflows/inspect-live-proven-ural.yml
          rm -f .github/workflows/restore-live-proven-motor-p1.yml
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add resource/map/multi/attack_support_waves.inc \
                  resource/map/multi/defense_support_waves.inc \
                  resource/map/multi/enemy_attack_support.inc \
                  resource/map/multi/enemy_defense_support.inc \
                  tests/test_motor_package1_restore.py \
                  .github/workflows
          git commit -m 'Restore live-proven motor package 1'
          git push origin HEAD:experiment/attack-mate-slot-proof
