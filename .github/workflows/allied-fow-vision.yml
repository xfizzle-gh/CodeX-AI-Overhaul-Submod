name: Allied FoW vision owner

on:
  push:
    branches:
      - fix/allied-support-shared-fow-vision
    paths:
      - tools/apply_allied_fow_vision_owner.py
      - tools/deploy_allied_fow_vision_test.ps1
      - tests/test_allied_fow_vision_owner.py
      - .github/workflows/allied-fow-vision.yml
  pull_request:
    paths:
      - tools/apply_allied_fow_vision_owner.py
      - tools/deploy_allied_fow_vision_test.ps1
      - tests/test_allied_fow_vision_owner.py
      - .github/workflows/allied-fow-vision.yml

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile overlay
        run: python -m py_compile tools/apply_allied_fow_vision_owner.py
      - name: Run owner-routing tests
        run: python -m unittest tests/test_allied_fow_vision_owner.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse test deployer with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/deploy_allied_fow_vision_test.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
