name: Apply explicit CWA support proof

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Patch all CWA maps and shared proof
        run: python .github/scripts/apply_explicit_support_probe.py
      - name: Correct runtime-created waypoint guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_woodland_support_probe.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("                self.assertIn('{\"1\"', mission)\n", "")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Run structural guard
        run: python -m unittest tests/test_woodland_support_probe.py
      - name: Commit target files and remove temporary runner
        shell: bash
        run: |
          rm -f .github/scripts/apply_explicit_support_probe.py
          rm -f .github/workflows/apply-explicit-support-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Embed explicit support proof on every CWA map"
          git push origin HEAD:${{ github.head_ref }}
