name: Mate Native Spawn FoW Probe

on:
  pull_request:
    paths:
      - "resource/script/multiplayer/modes/attack_support.lua"
      - "tests/test_mate_native_spawn_fow.py"
      - ".github/workflows/mate-native-spawn-fow.yml"
  workflow_dispatch:

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run native Mate spawn FoW regression
        run: python tests/test_mate_native_spawn_fow.py
