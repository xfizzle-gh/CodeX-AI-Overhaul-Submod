name: Motor arrival release overlay

on:
  push:
    branches:
      - experiment/attack-mate-slot-proof
    paths:
      - "tools/apply_motor_arrival_release_overlay.py"
      - "tools/deploy_attack_support_motor_arrival_test.ps1"
      - "tests/test_motor_arrival_release_overlay.py"
      - ".github/workflows/motor-arrival-release-overlay.yml"
  pull_request:
    paths:
      - "tools/apply_motor_arrival_release_overlay.py"
      - "tools/deploy_attack_support_motor_arrival_test.ps1"
      - "tests/test_motor_arrival_release_overlay.py"
      - ".github/workflows/motor-arrival-release-overlay.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile overlay
        run: python -m py_compile tools/apply_motor_arrival_release_overlay.py
      - name: Test overlay against all four motor engines
        run: python -m unittest tests/test_motor_arrival_release_overlay.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse test deployer
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/deploy_attack_support_motor_arrival_test.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
