name: Run live air and motor fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-live-air-motor-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0

      - name: Execute pinned repair script
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/apply-live-air-motor-fixes.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          raw = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          ) + "\n"

          # The deploy file's marker arrays were expanded after the pinned script was
          # drafted. Replace that stale exact-string edit with scoped array edits.
          deploy_start = script.index("# Deploy guards describe the new live contract.")
          deploy_end = script.index("# Update structural tests to pin the repaired contracts.", deploy_start)
          deploy_patch = r'''# Deploy guards describe the new live contract.
          deploy = replace_n(
              deploy,
              "    '{Link 0xc203 {0xc200 \"seat1\"}}'\n)",
              "    '{Link 0xc203 {0xc200 \"seat1\"}}',\n    'support_e2_marker_tpl',\n    '0xc207',\n    '{MID 10016}'\n)",
              1,
              'deploy independent marker guard',
          )
          required_start = deploy.index('$E2ParaWaveMarkers = @(')
          required_end = deploy.index(')\n$E2ParaForbiddenMarkers', required_start)
          para_required = deploy[required_start:required_end]
          para_required = replace_n(
              para_required,
              "    '{distance 4000}',\n",
              "    '{distance 4000}',\n    '{distance 1500}',\n",
              1,
              'deploy required para release radius',
          )
          deploy = deploy[:required_start] + para_required + deploy[required_end:]

          forbidden_start = deploy.index('$E2ParaForbiddenMarkers = @(')
          forbidden_end = deploy.index(')\nforeach', forbidden_start)
          para_forbidden = deploy[forbidden_start:forbidden_end]
          para_forbidden = replace_n(
              para_forbidden,
              "    '{distance 1500}',\n",
              "",
              1,
              'remove valid release radius from forbidden markers',
          )
          deploy = deploy[:forbidden_start] + para_forbidden + deploy[forbidden_end:]
          deploy = replace_n(
              deploy,
              "    '{\"attack_support/e2_para_alive\"',\n",
              "    '{\"attack_support/e2_para_alive\"',\n    '{\"attack_support/e2_para_takeover\"',\n",
              1,
              'deploy takeover trigger guard',
          )

          '''
          script = script[:deploy_start] + deploy_patch + script[deploy_end:]

          # Only the release trigger retires 600/4000. The closest-approach tracker
          # intentionally retains both distances, so the whole para section cannot ban them.
          ring_start = script.index("new_ring_assert = '''")
          ring_end = script.index("e2_tests = replace_n(e2_tests, old_ring_assert", ring_start)
          corrected_ring = r'''new_ring_assert = '''                self.assertEqual(
                    sorted(int(v) for v in re.findall(r"\{distance (\d+)\}", condition)),
                    [1500],
                )
        # The older 2500-unit shell stays retired. The range tracker still owns
        # 600/4000, while 1500 is now the release radius.
        self.assertNotIn("{distance 2500}", self.para)
        self.assertIn("'{distance 2500}'", self.deploy)
        self.assertIn("{distance 600}", self.para)
        self.assertIn("{distance 4000}", self.para)
        self.assertIn("{distance 1500}", self.para)'''
          '''
          script = script[:ring_start] + corrected_ring + script[ring_end:]

          Path('/tmp/apply_live_fixes.py').write_text(script, encoding='utf-8')
          subprocess.run(['python', '/tmp/apply_live_fixes.py'], check=True)
          PY

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused and full tests
        run: |
          python -m pytest tests/test_e2_airmobile.py -q
          python -m pytest tests/test_attack_support_slot_proof.py -q -k 'motor or objective or drive_phase or linked'
          python -m pytest tests/ -q
          git diff --check

      - name: Commit repairs and remove temporary workflows
        run: |
          rm -f .github/workflows/apply-live-air-motor-fixes.yml
          rm -f .github/workflows/run-live-air-motor-fixes.yml
          rm -f .github/workflows/export-live-debug-branch.yml
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add resource/map/multi/attack_support_waves.inc \
                  resource/map/multi/defense_support_waves.inc \
                  resource/map/multi/enemy_attack_support.inc \
                  resource/map/multi/enemy_defense_support.inc \
                  resource/map/multi/faction_support_templates.inc \
                  tools/deploy_attack_support_probe.ps1 \
                  tests/test_e2_airmobile.py \
                  tests/test_attack_support_slot_proof.py \
                  .github/workflows
          git commit -m 'Fix live helicopter, paradrop, and motor delivery'
          git push origin HEAD:experiment/attack-mate-slot-proof
