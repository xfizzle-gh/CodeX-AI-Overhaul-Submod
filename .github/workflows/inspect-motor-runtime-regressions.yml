name: Inspect motor runtime regressions

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-motor-runtime-regressions.yml

jobs:
  inspect:
    if: github.head_ref == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0
      - name: Print all motor lifecycles and selection collisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def balanced(text, token):
              start=text.index(token)
              opener=token[0]
              closer=')' if opener=='(' else '}'
              depth=0; quote=False; esc=False
              for i in range(start,len(text)):
                  c=text[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': quote=False
                      continue
                  if c=='"': quote=True
                  elif c==opener: depth+=1
                  elif c==closer:
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise RuntimeError(token)

          cases=[
            ('resource/map/multi/attack_support_waves.inc','(define "as_choose_entry"'),
            ('resource/map/multi/attack_support_waves.inc','(define "as_finish_motor"'),
            ('resource/map/multi/defense_support_waves.inc','(define "ds_finish_motor"'),
            ('resource/map/multi/enemy_attack_support.inc','(define "ea_finish_motor"'),
            ('resource/map/multi/enemy_defense_support.inc','(define "ed_finish_motor"'),
            ('resource/map/multi/enemy_defense_support.inc','(define "ed_assign_group"'),
          ]
          for path,token in cases:
              text=Path(path).read_text(encoding='utf-8-sig')
              print('\n===== '+path+' :: '+token+' =====')
              print(balanced(text,token))

          paths=[
            'resource/map/multi/attack_support_waves.inc',
            'resource/map/multi/defense_support_waves.inc',
            'resource/map/multi/enemy_attack_support.inc',
            'resource/map/multi/enemy_defense_support.inc',
          ]
          for path in paths:
              text=Path(path).read_text(encoding='utf-8-sig')
              print('\n===== NAMED WAYPOINT MOVE EXAMPLES :: '+path+' =====')
              for m in re.finditer(r'\{"action".*?\n\s*\}', text, flags=re.S):
                  b=m.group(0)
                  if '{action move}' in b and 'attack_support_entry_' in b:
                      print(b[:1200]); print('---')
              print('\n===== GENERIC SOURCE/GROUP TOUCHES :: '+path+' =====')
              for line_no,line in enumerate(text.splitlines(),1):
                  if any(k in line for k in ('motor_leaving','_src}','_p1}','_p2}','_p3}','_p4}')):
                      if any(k in line for k in ('selector','tag_add','tag_remove','select {tag')):
                          print(f'{line_no}: {line}')
          PY
