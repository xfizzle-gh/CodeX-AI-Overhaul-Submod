name: Conquest DefenderBot guard

on:
  pull_request:
    paths:
      - "resource/script/multiplayer/modes/conquest.lua"
      - "tests/test_conquest_defender_bot.py"
      - ".github/workflows/conquest-defender-bot-guard.yml"
  push:
    branches:
      - main
    paths:
      - "resource/script/multiplayer/modes/conquest.lua"
      - "tests/test_conquest_defender_bot.py"
      - ".github/workflows/conquest-defender-bot-guard.yml"

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run DefenderBot source guard
        run: python -m unittest tests/test_conquest_defender_bot.py
