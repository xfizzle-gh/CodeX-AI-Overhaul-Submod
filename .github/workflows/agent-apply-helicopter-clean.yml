name: Apply clean helicopter checkpoint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'experiment/attack-mate-slot-proof' || github.ref_name == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0
      - name: Download and verify clean helicopter patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/8e4b89176890d249ccd2c2f59825ea2bd83065f0" \
            | python -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
            > /tmp/helo.patch.gz
          gzip -t /tmp/helo.patch.gz
          gzip -dc /tmp/helo.patch.gz > /tmp/helo.patch
          echo '202698fa3113b44d0df2bfe4abcbc4fa1e395fab4cb1c05fa3d9cb2fa65546eb  /tmp/helo.patch' | sha256sum -c -
          git apply --check /tmp/helo.patch
          git apply /tmp/helo.patch
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run focused helicopter tests
        run: |
          python -m pytest \
            tests/test_e2_airmobile.py \
            tests/test_attack_support_slot_proof.py::LinkedBodyPlacementTests \
            tests/test_attack_support_slot_proof.py::AttackSupportAirmobileTests \
            -q
          git diff --check
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/agent-recover-helo-blob.yml
          rm -f .github/workflows/agent-apply-helicopter-clean.yml
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add \
            resource/map/multi/attack_support_waves.inc \
            resource/map/multi/faction_support_templates.inc \
            tests/test_attack_support_slot_proof.py \
            tests/test_e2_airmobile.py \
            tools/deploy_attack_support_probe.ps1 \
            .github/workflows
          git commit -m 'Land helicopters and disembark linked passengers'
          git push origin HEAD:experiment/attack-mate-slot-proof
