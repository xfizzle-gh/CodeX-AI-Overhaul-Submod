name: Normal transport-only validation

on:
  push:
    branches:
      - experiment/defense-transport-control-comparison
    paths:
      - tools/apply_normal_transport_only.py
      - tools/apply_normal_transport_only_fixed.py
      - tools/apply_transport_control_comparison.py
      - tools/deploy_known_good_motor_30s_test.ps1
      - tools/deploy_runtime_proven_motor_60s.ps1
      - tools/deploy_friendly_defender_motor_one_shot.ps1
      - tools/deploy_transport_control_comparison.ps1
      - tests/test_normal_transport_only.py
      - .github/workflows/defense-transport-control-comparison.yml
  pull_request:
    paths:
      - tools/apply_normal_transport_only.py
      - tools/apply_normal_transport_only_fixed.py
      - tools/apply_transport_control_comparison.py
      - tools/deploy_known_good_motor_30s_test.ps1
      - tools/deploy_runtime_proven_motor_60s.ps1
      - tools/deploy_friendly_defender_motor_one_shot.ps1
      - tools/deploy_transport_control_comparison.ps1
      - tests/test_normal_transport_only.py
      - .github/workflows/defense-transport-control-comparison.yml

jobs:
  normal-transports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/defense-transport-control-comparison
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile normal transport overlay
        run: |
          python -m py_compile tools/apply_normal_transport_only.py
          python -m py_compile tools/apply_normal_transport_only_fixed.py
          python -m py_compile tools/apply_transport_control_comparison.py
      - name: Validate exactly two ordinary AI transports
        run: python -m unittest tests/test_normal_transport_only.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/defense-transport-control-comparison
      - name: Parse deployment chain with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($path in @(
            "tools/deploy_known_good_motor_30s_test.ps1",
            "tools/deploy_runtime_proven_motor_60s.ps1",
            "tools/deploy_friendly_defender_motor_one_shot.ps1",
            "tools/deploy_transport_control_comparison.ps1"
          )) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
