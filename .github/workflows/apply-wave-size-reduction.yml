name: Apply DCG wave-size reduction

on:
  push:
    branches:
      - balance/reduce-dcg-wave-sizes-15pct
    paths:
      - "tools/apply_wave_size_reduction.py"
      - ".github/workflows/apply-wave-size-reduction.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: balance/reduce-dcg-wave-sizes-15pct
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply guarded patch
        run: python tools/apply_wave_size_reduction.py

      - name: Run Conquest source guard
        run: python -m unittest tests/test_conquest_defender_bot.py

      - name: Commit resulting balance change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reduce normal DCG wave sizes by 15 percent"
          git push origin HEAD:balance/reduce-dcg-wave-sizes-15pct
