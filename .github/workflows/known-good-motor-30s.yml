name: Known-good motor 30s overlay

on:
  push:
    branches:
      - test/known-good-motor-30s
    paths:
      - tools/apply_known_good_motor_30s_test.py
      - tools/deploy_known_good_motor_30s_test.ps1
      - tests/test_known_good_motor_30s_overlay.py
      - .github/workflows/known-good-motor-30s.yml
  pull_request:
    paths:
      - tools/apply_known_good_motor_30s_test.py
      - tools/deploy_known_good_motor_30s_test.ps1
      - tests/test_known_good_motor_30s_overlay.py
      - .github/workflows/known-good-motor-30s.yml

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile overlay
        run: python -m py_compile tools/apply_known_good_motor_30s_test.py
      - name: Test against known-good source files
        run: python -m unittest tests/test_known_good_motor_30s_overlay.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse deployment wrapper
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/deploy_known_good_motor_30s_test.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
