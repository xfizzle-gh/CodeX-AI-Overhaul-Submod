name: Fix runtime transport proof

on:
  push:
    branches:
      - experiment/attack-mate-slot-proof
    paths:
      - .github/workflows/fix-runtime-transport-proof.yml
      - tools/patch_runtime_transport_proof.py
      - tools/prepare_runtime_transport_patch.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-runtime-transport-proof.yml
      - tools/patch_runtime_transport_proof.py
      - tools/prepare_runtime_transport_patch.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0

      - name: Apply runtime transport repair
        run: |
          python -m py_compile tools/prepare_runtime_transport_patch.py
          python tools/prepare_runtime_transport_patch.py
          python -m py_compile tools/patch_runtime_transport_proof.py
          python tools/patch_runtime_transport_proof.py
          python -m py_compile tests/test_motor_runtime_isolation.py
          git diff --check

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused arrival and transport tests
        run: |
          python -m pytest tests/test_motor_runtime_isolation.py tests/test_motor_package1_restore.py -q
          python -m pytest tests/test_attack_support_slot_proof.py tests/test_enemy_defense_support.py tests/test_defense_mission_support.py -q -k 'motor or linked or package or flank or deploy or air_test or placement'

      - name: Run hosted-compatible repository suite
        run: |
          python -m pytest tests/ -q \
            --deselect=tests/test_attack_support_slot_proof.py::AttackSupportSlotProofTests::test_wave_pool_is_deep_enough_for_the_level_budget \
            --deselect=tests/test_enemy_defense_support.py::EnemyDefenseSupportTests::test_pool_parks_four_faction_pools_deep_enough_for_the_budget

      - name: Publish clean repair
        shell: bash
        run: |
          rm -f .github/workflows/fix-runtime-transport-proof.yml
          rm -f tools/patch_runtime_transport_proof.py
          rm -f tools/prepare_runtime_transport_patch.py
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add resource/map/multi/attack_support_waves.inc \
                  resource/map/multi/defense_support_waves.inc \
                  resource/map/multi/enemy_attack_support.inc \
                  resource/map/multi/enemy_defense_support.inc \
                  tools/deploy_attack_support_probe.ps1 \
                  tests/test_motor_runtime_isolation.py \
                  .github/workflows/fix-runtime-transport-proof.yml \
                  tools/patch_runtime_transport_proof.py \
                  tools/prepare_runtime_transport_patch.py
          git commit -m 'Fail closed on invalid motor inserts and spread arrivals'
          git push origin HEAD:experiment/attack-mate-slot-proof
