name: Fix runtime transport proof

on:
  push:
    branches:
      - experiment/attack-mate-slot-proof
    paths:
      - .github/workflows/fix-runtime-transport-proof.yml
      - tools/patch_runtime_transport_proof.py
      - tools/prepare_runtime_transport_patch.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-runtime-transport-proof.yml
      - tools/patch_runtime_transport_proof.py
      - tools/prepare_runtime_transport_patch.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
          fetch-depth: 0

      - name: Apply runtime transport repair
        run: |
          python -m py_compile tools/prepare_runtime_transport_patch.py
          python tools/prepare_runtime_transport_patch.py
          python -m py_compile tools/patch_runtime_transport_proof.py
          python tools/patch_runtime_transport_proof.py
          python - <<'PY'
          from pathlib import Path

          old_comment = '''; DAY-2 TEST: attack_support_air_test$=1 (default) forces first insert ~30s after arm.
          ; Set attack_support_air_test$=0 in init to restore production-only schedule.'''
          new_comment = '''; Legacy forced airmobile test is OFF. E2TestMode controls explicit air testing.
          ; Production airmobile remains on its normal level-gated random schedule.'''
          attack_path = Path("resource/map/multi/attack_support_waves.inc")
          attack = attack_path.read_text(encoding="utf-8")
          if attack.count(old_comment) != 1:
              raise RuntimeError("obsolete forced-air comment not found exactly once")
          attack_path.write_text(attack.replace(old_comment, new_comment), encoding="utf-8")

          attack_test = Path("tests/test_attack_support_slot_proof.py")
          text = attack_test.read_text(encoding="utf-8")
          old = '''        # Day-2 test default ON in init
                  self.assertIn(
                      '{var "attack_support_air_test$"} {op "="} {value 1}', self.waves
                  )'''
          new = '''        # Runtime default OFF. Explicit E2TestMode is the only forced air path.
                  self.assertIn(
                      '{var "attack_support_air_test$"} {op "="} {value 0}', self.waves
                  )
                  self.assertNotIn(
                      '{var "attack_support_air_test$"} {op "="} {value 1}', self.waves
                  )'''
          if text.count(old) != 1:
              raise RuntimeError("obsolete attack forced-air assertion not found exactly once")
          text = text.replace(old, new)
          text = text.replace(
              '        # Easy revert documented\n        self.assertIn("Set attack_support_air_test$=0", self.waves)\n',
              '        self.assertIn("Legacy forced airmobile test is OFF", self.waves)\n',
          )
          attack_test.write_text(text, encoding="utf-8")

          defense_test = Path("tests/test_defense_mission_support.py")
          text = defense_test.read_text(encoding="utf-8")
          old = '''        # Shared Day-2 toggle set on defense garrison
                  garr = trigger_block(code, "defense_support/garrison_init")
                  self.assertIn('{var "attack_support_air_test$"} {op "="} {value 1}', garr)'''
          new = '''        # Shared legacy force toggle is explicitly parked on defense garrison.
                  garr = trigger_block(code, "defense_support/garrison_init")
                  self.assertIn('{var "attack_support_air_test$"} {op "="} {value 0}', garr)
                  self.assertNotIn('{var "attack_support_air_test$"} {op "="} {value 1}', garr)'''
          if text.count(old) != 1:
              raise RuntimeError("obsolete defense forced-air assertion not found exactly once")
          defense_test.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile tests/test_motor_runtime_isolation.py tests/test_attack_support_slot_proof.py tests/test_defense_mission_support.py
          git diff --check

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused arrival and transport tests
        run: |
          python -m pytest tests/test_motor_runtime_isolation.py tests/test_motor_package1_restore.py -q
          python -m pytest tests/test_attack_support_slot_proof.py tests/test_enemy_defense_support.py tests/test_defense_mission_support.py -q -k 'motor or linked or package or flank or deploy or air_test or placement'

      - name: Run hosted-compatible repository suite
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q -x --tb=short \
            --deselect=tests/test_attack_support_slot_proof.py::AttackSupportSlotProofTests::test_wave_pool_is_deep_enough_for_the_level_budget \
            --deselect=tests/test_enemy_defense_support.py::EnemyDefenseSupportTests::test_pool_parks_four_faction_pools_deep_enough_for_the_budget \
            2>&1 | tee full-suite.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload full-suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-transport-full-suite
          path: full-suite.log
          if-no-files-found: ignore

      - name: Publish clean repair
        shell: bash
        run: |
          rm -f .github/workflows/fix-runtime-transport-proof.yml
          rm -f tools/patch_runtime_transport_proof.py
          rm -f tools/prepare_runtime_transport_patch.py
          git config user.name 'OpenAI Codex Agent'
          git config user.email 'noreply@openai.com'
          git add resource/map/multi/attack_support_waves.inc \
                  resource/map/multi/defense_support_waves.inc \
                  resource/map/multi/enemy_attack_support.inc \
                  resource/map/multi/enemy_defense_support.inc \
                  tools/deploy_attack_support_probe.ps1 \
                  tests/test_motor_runtime_isolation.py \
                  tests/test_attack_support_slot_proof.py \
                  tests/test_defense_mission_support.py \
                  .github/workflows/fix-runtime-transport-proof.yml \
                  tools/patch_runtime_transport_proof.py \
                  tools/prepare_runtime_transport_patch.py
          git commit -m 'Fail closed on invalid motor inserts and spread arrivals'
          git push origin HEAD:experiment/attack-mate-slot-proof
