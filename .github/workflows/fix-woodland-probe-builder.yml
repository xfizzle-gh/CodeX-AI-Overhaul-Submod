name: Harden woodland probe builder

on:
  pull_request:
    paths:
      - "tools/fix_woodland_probe_builder.py"
      - ".github/workflows/fix-woodland-probe-builder.yml"
  push:
    branches:
      - prototype/woodland-defenderbot-ownership
    paths:
      - "tools/fix_woodland_probe_builder.py"
      - ".github/workflows/fix-woodland-probe-builder.yml"

permissions:
  contents: write

jobs:
  harden:
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'Harden woodland ownership probe builder'
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v6
        with:
          ref: prototype/woodland-defenderbot-ownership
          fetch-depth: 0

      - name: Harden guarded builder
        run: |
          set +e
          mkdir -p docs
          python tools/fix_woodland_probe_builder.py > docs/woodland_probe_builder_error.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/woodland_probe_builder_error.txt
            git commit -m "Record woodland probe builder failure"
            git push origin HEAD:prototype/woodland-defenderbot-ownership
            cat docs/woodland_probe_builder_error.txt
            exit "$status"
          fi
          rm -f docs/woodland_probe_builder_error.txt

      - name: Compile guarded builder
        run: python -m py_compile tools/apply_woodland_support_probe.py

      - name: Commit hardened builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden woodland ownership probe builder"
          git push origin HEAD:prototype/woodland-defenderbot-ownership
