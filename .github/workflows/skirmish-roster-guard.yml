name: Skirmish roster guard

on:
  pull_request:
    paths:
      - "resource/set/multiplayer/units/**"
      - "resource/script/multiplayer/units/**"
      - "tools/validate_skirmish_rosters.py"
      - ".github/workflows/skirmish-roster-guard.yml"
  push:
    branches:
      - main
    paths:
      - "resource/set/multiplayer/units/**"
      - "resource/script/multiplayer/units/**"
      - "tools/validate_skirmish_rosters.py"
      - ".github/workflows/skirmish-roster-guard.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reject Conquest-file changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD')"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -E '(^|/)[^/]*conquest[^/]*(/|$)'; then
            echo "Battle Zones PRs must not modify Conquest files."
            exit 1
          fi

      - name: Run skirmish roster validator
        id: roster
        shell: bash
        run: |
          set +e
          output="$(python tools/validate_skirmish_rosters.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          summary="$(printf '%s\n' "$output" | sed -n '2,7p' | tr '\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g' | cut -c1-240)"
          if [ -z "$summary" ]; then
            summary="validator returned status $status"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: "Roster validation failed: ${{ steps.roster.outputs.summary }}"
        if: steps.roster.outputs.status != '0'
        run: exit 1

      - name: Roster validation passed
        if: steps.roster.outputs.status == '0'
        run: echo "Skirmish roster validation passed."
