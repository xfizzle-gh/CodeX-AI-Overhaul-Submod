name: Skirmish roster guard

on:
  pull_request:
    paths:
      - "resource/set/multiplayer/units/**"
      - "resource/script/multiplayer/units/**"
      - "tools/validate_skirmish_rosters.py"
      - ".github/workflows/skirmish-roster-guard.yml"
  push:
    branches:
      - main
    paths:
      - "resource/set/multiplayer/units/**"
      - "resource/script/multiplayer/units/**"
      - "tools/validate_skirmish_rosters.py"
      - ".github/workflows/skirmish-roster-guard.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Scope skirmish roster validation
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD')"
          printf '%s\n' "$changed_files"

          # Battle Zones roster work must not mix ordinary Conquest unit-definition
          # changes. Issue #97 has exactly one explicit hidden, zero-cost Conquest
          # diagnostic unit, which is not a skirmish roster input.
          conquest_changes="$(printf '%s\n' "$changed_files" \
            | grep -E '^resource/set/multiplayer/units/conquest/' \
            | grep -v '^resource/set/multiplayer/units/conquest/native_support_test_rusa\.set$' \
            || true)"
          if [ -n "$conquest_changes" ]; then
            printf '%s\n' "$conquest_changes"
            echo "Battle Zones PRs must not modify Conquest files."
            exit 1
          fi

          # Do not execute the skirmish validator for a Conquest-only diagnostic.
          # The validator currently has independent base failures for missing
          # inf_rusa.set / inf_prc_era1960.set inputs, so running it here would not
          # validate this PR. Normal skirmish unit/script/tool changes still run it.
          skirmish_changes="$(printf '%s\n' "$changed_files" \
            | grep -E '^(resource/set/multiplayer/units/|resource/script/multiplayer/units/|tools/validate_skirmish_rosters\.py$)' \
            | grep -v '^resource/set/multiplayer/units/conquest/native_support_test_rusa\.set$' \
            || true)"
          if [ -n "$skirmish_changes" ]; then
            echo "run_validator=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_validator=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run skirmish roster validator
        id: roster
        if: github.event_name != 'pull_request' || steps.scope.outputs.run_validator == 'true'
        shell: bash
        run: |
          set +e
          output="$(python tools/validate_skirmish_rosters.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          summary="$(printf '%s\n' "$output" | sed -n '2,7p' | tr '\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g' | cut -c1-240)"
          if [ -z "$summary" ]; then
            summary="validator returned status $status"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: "Roster validation failed: ${{ steps.roster.outputs.summary }}"
        if: (github.event_name != 'pull_request' || steps.scope.outputs.run_validator == 'true') && steps.roster.outputs.status != '0'
        run: exit 1

      - name: Roster validation passed
        if: (github.event_name != 'pull_request' || steps.scope.outputs.run_validator == 'true') && steps.roster.outputs.status == '0'
        run: echo "Skirmish roster validation passed."

      - name: Skirmish validation not applicable
        if: github.event_name == 'pull_request' && steps.scope.outputs.run_validator != 'true'
        run: echo "No skirmish roster inputs changed; Conquest-only issue #97 diagnostic is out of scope."
