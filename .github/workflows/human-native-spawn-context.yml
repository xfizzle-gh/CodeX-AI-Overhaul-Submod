name: Human Native Spawn Context Probe

on:
  pull_request:
    paths:
      - "resource/script/multiplayer/bot.main.lua"
      - "resource/script/multiplayer/modes/human_native_spawn_probe.lua"
      - "resource/set/multiplayer/games/campaign_capture_the_flag.set"
      - "tests/test_human_native_spawn_context.py"
      - "tests/test_allied_support_shared_fow.py"
      - ".github/workflows/human-native-spawn-context.yml"
  workflow_dispatch:

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run human native spawn context regression
        run: python tests/test_human_native_spawn_context.py
