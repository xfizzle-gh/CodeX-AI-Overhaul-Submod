name: Inspect live-proven Ural motor path

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-live-proven-ural.yml

jobs:
  inspect:
    if: github.head_ref == 'experiment/attack-mate-slot-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/attack-mate-slot-proof
      - name: Locate exact Ural motor source lines
        shell: bash
        run: |
          grep -n '"attack_support/ally_rusa_motor"' resource/map/multi/attack_support_waves.inc
          grep -n '"enemy_defense/rusa_motor"' resource/map/multi/enemy_defense_support.inc
          grep -n '(define "as_finish_motor"' resource/map/multi/attack_support_waves.inc
          grep -n '(define "ed_finish_motor"' resource/map/multi/enemy_defense_support.inc
