name: Apply Conquest identity retry correction

on:
  push:
    branches:
      - agent/dcg-allied-defender-waves
    paths:
      - tools/apply_dcg_identity_retry_fix.py
      - .github/workflows/apply-dcg-identity-retry-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/dcg-allied-defender-waves
          fetch-depth: 0
      - run: python tools/apply_dcg_identity_retry_fix.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Retry late Conquest identities on first quant"
          git push origin HEAD:agent/dcg-allied-defender-waves
